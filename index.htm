<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Creek Casebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Reenie+Beanie&family=Pinyon+Script&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#4B3627; --desk2:#3E2C20; --deskText:#E8DDC9; --deskFaint:#B9A78C;
  --paper:#F3EEE3; --paper2:#E9E0CC; --manila:#D5C29A; --manila2:#C8B287;
  --ink:#1E1A16; --ink2:#4A4136; --faint:#7B705F; --rule:rgba(30,26,22,.2);
  --news:"Old Standard TT",Georgia,"Times New Roman",serif;
  --mast:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
  --typeH:"Special Elite","Courier New",Courier,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#2C2017;--desk2:#231910;--deskText:#DCCFB8;--deskFaint:#A08F76}}
:root[data-theme="dark"]{--desk:#2C2017;--desk2:#231910;--deskText:#DCCFB8;--deskFaint:#A08F76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background-color:var(--desk);
  background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px,rgba(255,255,255,.02) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--desk),var(--desk2));
  color:var(--deskText);font-family:var(--type);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible+label{outline:2px solid var(--deskText);outline-offset:2px}
.paper button:focus-visible,.paper textarea:focus-visible{outline-color:var(--ink)}

.deskline{max-width:1280px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;color:var(--deskFaint);font-size:14px}
.deskline b{color:var(--deskText);font-weight:400}
.desk{max-width:1280px;margin:0 auto;padding:10px 20px 60px;display:grid;gap:20px;grid-template-columns:200px minmax(0,1fr)}
.desk.withfiles{grid-template-columns:200px minmax(0,1fr) minmax(0,380px)}
@media(max-width:1100px){.desk.withfiles{grid-template-columns:200px minmax(0,1fr)}.files-area{grid-column:2}}
@media(max-width:760px){.desk,.desk.withfiles{grid-template-columns:1fr}.files-area{grid-column:auto}}

/* desk items */
.items{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media(max-width:760px){.items{position:static;flex-direction:row;flex-wrap:wrap}}
.item{display:block;text-align:left;width:100%;background:var(--paper2);color:var(--ink);padding:10px 12px 9px;border-left:4px solid var(--manila2);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);transition:transform .12s}
@media(max-width:760px){.item{width:auto;flex:1 1 150px}}
.item:hover{transform:translateX(2px)}
.item[aria-current="true"]{background:var(--paper);border-left-color:var(--ink)}
.item .t{display:block;font-family:var(--typeH);font-size:15px}
.item .s{display:block;font-size:12px;color:var(--faint)}
.item.act{background:transparent;color:var(--deskText);border:1px solid var(--deskFaint);border-left-width:1px;box-shadow:none}
.item.act .s{color:var(--deskFaint)}
.item.act:hover{border-color:var(--deskText)}

/* paper */
.doc-area{min-width:0}
.paper{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.4);padding:30px 32px;position:relative}
@media(max-width:520px){.paper{padding:22px 18px}}
.paper+.paper{margin-top:18px}
.lh{text-align:center;font-family:var(--typeH);font-size:13px;letter-spacing:.06em;color:var(--ink2)}
.formtitle{text-align:center;font-family:var(--typeH);font-weight:400;font-size:22px;margin:6px 0 18px;letter-spacing:.08em}
.frow{display:flex;flex-wrap:wrap;gap:4px 18px;margin:3px 0}
.fld{display:flex;gap:8px;min-width:0;flex:1 1 260px}
.fld .l{color:var(--faint);white-space:nowrap}
.fld .v{border-bottom:1px dotted var(--rule);flex:1;min-width:0}
.sect{font-family:var(--typeH);font-size:14px;letter-spacing:.06em;margin:22px 0 6px;border-bottom:1px solid var(--ink);padding-bottom:2px}
.obs{margin:6px 0 0;padding-left:26px}
.obs li{margin:4px 0}
.qa p{margin:4px 0}
.nm{border-bottom:1px dotted var(--ink2);text-align:left}
.nm:hover{border-bottom-style:solid}
.persons{list-style:none;margin:6px 0;padding:0}
.persons li{margin:4px 0}
.persons .why{color:var(--faint)}
.disp{margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{flex:none;white-space:pre}
.sign{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border:1px solid var(--ink);padding:7px 16px;font-family:var(--typeH);letter-spacing:.04em}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default;background:none;color:var(--ink)}
.stamp{position:absolute;top:26px;right:28px;border:3px double var(--ink);padding:4px 12px;font-family:var(--typeH);font-size:20px;letter-spacing:.2em;transform:rotate(-7deg);opacity:.75}
.muted{color:var(--faint)}
.signed{font-family:var(--hand);font-size:24px;margin-left:6px}

/* in-tray */
.folders{display:flex;flex-direction:column;gap:12px}
.folder{display:block;width:100%;text-align:left;background:var(--manila);color:var(--ink);padding:14px 18px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.3);position:relative}
.folder::before{content:"";position:absolute;top:-8px;left:14px;width:110px;height:9px;background:var(--manila)}
.folder .t{font-family:var(--typeH);font-size:16px}
.folder .s{display:block;font-size:13px;color:var(--ink2)}
.folder.done{background:var(--manila2);opacity:.8}
.folder.done::before{background:var(--manila2)}

/* newspaper */
.news{font-family:var(--news);padding:24px 28px 30px}
.mast{text-align:center;font-family:var(--mast);font-size:clamp(34px,6vw,56px);line-height:1;margin:6px 0 4px}
.ears{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-size:12px}
.ears .e{border:1px solid var(--ink);padding:4px 6px;line-height:1.3}
.ears .e:last-child{text-align:right}
.ears .motto{font-style:italic;text-align:center}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);margin:8px 0 14px;padding:3px 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.cols{columns:3 230px;column-gap:22px;column-rule:1px solid var(--rule)}
.story{break-inside:avoid-column;margin:0 0 16px}
.story.lead{column-span:all;border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.hd{font-family:var(--news);font-weight:700;text-transform:uppercase;text-align:center;line-height:1.05;margin:0;font-size:19px;letter-spacing:.01em}
.lead .hd{font-size:clamp(26px,4vw,38px)}
.deck{text-align:center;font-size:14px;margin:5px auto 0;padding-bottom:6px;border-bottom:1px solid var(--rule);max-width:36em;text-transform:uppercase;letter-spacing:.02em}
.deck+.deck{border-bottom:none}
.story p{margin:8px 0 0;text-align:justify;hyphens:auto;font-size:15px;line-height:1.45}
.story p .dl{font-variant:small-caps;letter-spacing:.03em}
.lead p{max-width:44em;margin-left:auto;margin-right:auto}
.col-h{font-weight:700;text-align:center;font-size:14px;letter-spacing:.08em;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:2px 0;margin:0 0 6px}
.personal p{margin:6px 0;font-size:14px;text-align:justify}
.ad{break-inside:avoid-column;border:2px solid var(--ink);padding:8px 10px;text-align:center;margin:0 0 16px;font-size:13px}
.ad b{display:block;font-size:17px;letter-spacing:.04em}

/* slips */
.slips{display:flex;flex-wrap:wrap;gap:22px;padding:8px 4px}
.slip{background:#FBF8F0;color:var(--ink);padding:18px 20px 16px;width:min(100%,330px);font-family:var(--hand);font-size:22px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.35)}
.slip:nth-child(odd){transform:rotate(-1.3deg)}
.slip:nth-child(even){transform:rotate(1.1deg)}
.slip .sig{text-align:right;margin-top:8px}
.deskmsg{color:var(--deskFaint);font-style:italic;padding:8px 2px}

/* files */
.files-area{display:flex;flex-direction:column;gap:18px;align-self:start}
.rfile{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.4);position:relative}
.rfile .tab{background:var(--manila);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-family:var(--typeH)}
.rfile .tab button{font-size:13px;border-bottom:1px dotted var(--ink)}
.rfile .body{padding:14px 16px 16px;font-size:14px}
.rfile .fld{flex-basis:100%}
.rfile .fld .l{min-width:92px}
.rfile .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rfile .rec{margin:4px 0 0;padding-left:18px}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.card{text-align:left;background:#FBF8F0;border:1px solid var(--rule);padding:8px 10px;font-size:14px}
.card:hover{border-color:var(--ink)}
.card.open{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.card small{display:block;color:var(--faint);font-size:12px}

/* memo, letter, ledger */
.letter{font-size:15px;line-height:1.6}
.letter .head{text-align:center;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.letter .head b{display:block;font-family:var(--typeH);font-weight:400;font-size:18px;letter-spacing:.06em}
.letter p{margin:0 0 12px}
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger th{text-align:left;font-weight:400;color:var(--faint);border-bottom:1px solid var(--ink);padding:4px 6px}
.ledger td{border-bottom:1px dotted var(--rule);padding:6px;vertical-align:top}
.tablewrap{overflow-x:auto}
.calls{list-style:none;padding:0;margin:10px 0}
.calls li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
.calls .d{color:var(--faint);font-size:13px;flex:1 1 200px}
.convo p{margin:10px 0;line-height:1.6}
.convo .said{font-family:var(--news);font-style:italic;font-size:17px;padding-left:16px;border-left:2px solid var(--rule)}

/* notebook */
.nb{display:grid;grid-template-columns:1fr 1fr;background:#FBF8F0;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.45);position:relative;min-height:560px}
.nb::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:18px;margin-left:-9px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.12),transparent)}
@media(max-width:760px){.nb{grid-template-columns:1fr}.nb::after{display:none}.nb .pg.left{border-bottom:1px solid var(--rule)}}
.pg{--lh:30px;padding:26px 24px 20px 46px;position:relative;font-family:var(--hand);font-size:23px;line-height:var(--lh);
  background-image:linear-gradient(90deg,transparent 34px,rgba(90,60,40,.35) 34px 35px,transparent 35px),repeating-linear-gradient(180deg,transparent 0 calc(var(--lh) - 1px),rgba(30,26,22,.16) calc(var(--lh) - 1px) var(--lh));background-position:0 56px;background-repeat:no-repeat,repeat-y;background-size:100% 100%,100% calc(100% - 56px)}
.pg .ph{font-family:var(--hand);font-size:22px;height:30px;margin-bottom:26px;display:flex;justify-content:space-between;align-items:baseline}
.pg .ph button{font-family:var(--type);font-size:13px;color:var(--faint)}
.pg .ph button:disabled{visibility:hidden}
.pg .txt{white-space:pre-wrap;min-height:420px;word-wrap:break-word}
.pg textarea{width:100%;min-height:440px;border:none;background:transparent;font:inherit;line-height:var(--lh);color:var(--ink);resize:vertical;padding:0;margin:0;outline:none}
.pg .blank{color:var(--faint)}
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;font-size:13px;color:var(--deskFaint);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
.objbar{position:absolute;left:0;right:0;bottom:0;padding:8px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px;color:var(--deskText);background:linear-gradient(0deg,rgba(10,7,5,.92),rgba(10,7,5,.6) 70%,rgba(10,7,5,0));z-index:7}
.objbar .muted{color:var(--deskFaint)}
.objbar button{border-bottom:1px dotted var(--deskFaint);padding:2px 0}
.objbar button:hover{border-bottom-color:var(--deskText)}
.say{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:20px;font-family:"IM Fell English",Georgia,serif;line-height:1.35;color:var(--deskText);text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;max-width:90%;pointer-events:none;z-index:2;font-style:italic}
.tip{position:fixed;display:none;pointer-events:none;background:var(--paper);color:var(--ink);font-size:12px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3}
.reading{position:absolute;inset:0;z-index:5;display:none;overflow-y:auto;background:rgba(14,10,7,.72);padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(90px + env(safe-area-inset-bottom,0px))}
.reading.show{display:block}
.rbar{max-width:1500px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;color:var(--deskText);font-size:14px;position:sticky;top:0;z-index:1;padding:6px 0;background:linear-gradient(180deg,rgba(14,10,7,.9),rgba(14,10,7,0))}
.rbar button{border:1px solid var(--deskFaint);padding:5px 14px;font-family:var(--typeH)}
.rbar button:hover{border-color:var(--deskText)}
.rbar #rmsg{color:var(--deskFaint);font-style:italic}
.rdocs{max-width:1500px;margin:0 auto;display:grid;gap:18px;align-items:start}
.rdocs.n1{grid-template-columns:minmax(0,900px);justify-content:center}
.rdocs.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rdocs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.rdocs.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.rdocs.n2,.rdocs.n3{grid-template-columns:minmax(0,1fr)}}
.slot{min-width:0}
.slotbar{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--deskFaint);font-size:13px;padding:0 2px 6px}
.slotbar button{border-bottom:1px dotted var(--deskFaint);color:var(--deskText)}
.slot .paper,.slot .rfile{margin:0}
.slot .nb{grid-template-columns:1fr}
.slot .nb::after{display:none}
.rdocs.n1 .nb{grid-template-columns:1fr 1fr}
.rdocs.n1 .nb::after{display:block}
@media(max-width:760px){.rdocs.n1 .nb{grid-template-columns:1fr}.rdocs.n1 .nb::after{display:none}}
.slot .nb .pg.left{border-bottom:1px solid var(--rule)}
.rdocs.n1 .nb .pg.left{border-bottom:none}
.picker{position:absolute;inset:0;z-index:6;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(14,10,7,.6);padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
.picker.show{display:flex}
.pickbox{background:var(--paper2);color:var(--ink);width:min(760px,100%);padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pickbox .paper{box-shadow:none;padding:0;background:transparent}
.pickbox .deskmsg{color:var(--faint)}
#app.flat{background:linear-gradient(180deg,var(--desk),var(--desk2))}
#app.flat #c3d{display:none}
#app.flat .say{bottom:auto;top:60px}
@media(max-width:760px){.say{top:calc(96px + env(safe-area-inset-top,0px));bottom:auto}}
#app.flat .objbar{top:48px;bottom:auto;background:none;font-size:15px}

.namein{font:inherit;color:var(--ink);background:#FBF8F0;border:none;border-bottom:1px solid var(--ink);padding:5px 6px;min-width:220px}
.namein:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select.other{font:inherit;color:var(--ink);background:#FBF8F0;border:1px solid var(--rule);padding:2px 4px;max-width:100%}
.ledger tr.cur td{background:rgba(30,26,22,.06)}
.ledger td:first-child{white-space:nowrap}
.objbar .snd{margin-left:auto;color:var(--deskFaint)}
.talk{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));width:min(780px,94vw);max-height:56vh;overflow-y:auto;background:var(--paper);color:var(--ink);display:none;gap:16px;padding:16px 18px 14px;box-shadow:0 2px 0 rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.5);z-index:8}
.talk.show{display:flex}
#talkFace{width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none;background:var(--paper2);border:1px solid var(--rule)}
.talk .tb{min-width:0;flex:1}
.talk .tn{font-family:var(--typeH);font-size:15px;letter-spacing:.04em;border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:4px}
#talkText p{margin:6px 0;line-height:1.5}
#talkText p:first-child{color:var(--faint);font-style:italic}
.talk .tc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.talk .tc button{border:1px solid var(--ink);padding:6px 12px;text-align:left;font-family:var(--type)}
.talk .tc button:hover,.talk .tc button:focus-visible{background:var(--ink);color:var(--paper)}
@media(max-width:520px){#talkFace{width:48px;height:48px}.talk{gap:10px;padding:12px}}

.fade{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:#050403;color:#e6dcc6}
.fade.day.on{opacity:1;pointer-events:auto;transition:opacity .8s ease}
.fade.day.off{opacity:0;transition:opacity .8s ease}
.fade.eyes{background:transparent;opacity:1}
.fade.eyes::before,.fade.eyes::after{content:"";position:absolute;left:0;right:0;height:51%;background:#050403;transition:transform .6s cubic-bezier(.6,0,.4,1)}
.fade.eyes::before{top:0;transform:translateY(-101%)}
.fade.eyes::after{bottom:0;transform:translateY(101%)}
.fade.eyes.on{pointer-events:auto}
.fade.eyes.on::before,.fade.eyes.on::after{transform:translateY(0)}
.fade .ft,.fade .fs{position:relative;z-index:1;opacity:0;transition:opacity .45s ease .55s;text-align:center}
.fade.on .ft,.fade.on .fs{opacity:1}
.fade.off .ft,.fade.off .fs{opacity:0;transition-delay:0s}
.fade .ft{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:clamp(40px,8vw,76px);letter-spacing:.06em}
.fade .fs{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:18px;margin-top:8px;color:#b9ab92}
.talk .tn{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:19px;letter-spacing:.04em}
#talkText p.cap{font-family:"IM Fell English",Georgia,serif;font-size:22px;line-height:1.38;color:var(--ink);font-style:normal;margin:6px 0 2px}
#talkText p.narr{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:18px;color:var(--faint);margin:6px 0 2px}
#talkText p:first-child{color:inherit}
#talkText p.narr:first-child{color:var(--faint)}
.talk{cursor:pointer}
.talk .tc{flex-direction:row;flex-wrap:wrap;align-items:center}
.talk .tc button[data-ch]{flex:1 1 100%}
.talk .tc .more{border:1px solid var(--ink)}
.talk .tc .hurry{border:none;color:var(--faint);text-decoration:underline dotted;padding:6px 4px}
.talk .tc .hurry:hover{background:none;color:var(--ink)}
@media(max-width:520px){#talkText p.cap{font-size:19px}}
.signing{position:relative;display:inline-block;padding-right:10px}
.signing .sigtxt{font-family:"Pinyon Script",var(--hand);font-size:46px;line-height:1.1;display:inline-block;clip-path:inset(0 100% 0 0);animation:hc-write 1.8s steps(40) forwards;padding:0 6px 4px 2px}
.signed.big{font-family:"Pinyon Script",var(--hand);font-size:44px;line-height:1.1}
.signing .blot{position:absolute;right:2px;bottom:12px;width:7px;height:6px;border-radius:50%;background:#1b1612;opacity:0;animation:hc-blot .2s 1.8s forwards}
@keyframes hc-blot{to{opacity:.85}}
.signing .pen{position:absolute;bottom:-6px;left:-20px;animation:hc-pen 1.8s cubic-bezier(.4,.1,.6,.9) forwards,hc-wig .11s ease-in-out infinite alternate;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.35))}
@keyframes hc-write{to{clip-path:inset(0 0 0 0)}}
@keyframes hc-pen{0%{left:-20px;opacity:1}90%{opacity:1}100%{left:calc(100% - 40px);opacity:0}}
@keyframes hc-wig{from{transform:translate(0,0)}to{transform:translate(1px,-7px)}}
@media (prefers-reduced-motion:reduce){.signing .sigtxt{animation:none;clip-path:none}.signing .pen{display:none}}

.nb.worn .scr.blank{font-size:22px;color:rgba(60,40,20,.45);line-height:30px}

const REASONS=["Was seen near the scene that night.","Has been spending money freely.","Was out late with nobody to vouch for them.","Was spotted hurrying home after midnight.","Couldn't say where they were that night.","Was heard arguing near the scene."];
const SUPER_REASONS=["Said by some to have the evil eye.","Was seen walking toward the river bottoms that night.","The town wants someone to blame.","Heard muttering in a strange tongue on Main Street."];

/* ================= state ================= */
let N=null,S=null;
function newGame(){
  N=CAST.map((c,i)=>({...c,id:i,rel:c.shady>=2?35:c.id===MAYOR?50:45,jailed:false,known:new Set(),secretKnown:false,fam:[],friends:[],rivals:[],villain:false}));
  N.forEach((n,i)=>{n.id=i;n.rel=n.shady>=2?35:i===MAYOR?60:45});
  FAMILY.forEach(([a,b,la,lb])=>{N[a].fam.push({id:b,label:la});N[b].fam.push({id:a,label:lb})});
  FRIENDS.forEach(([a,b])=>{N[a].friends.push(b);N[b].friends.push(a)});
  RIVALS.forEach(([a,b])=>{N[a].rivals.push(b);N[b].rivals.push(a)});
  const vs=[];while(vs.length<3){const v=wpick(N.filter(n=>!vs.includes(n)&&n.id!==8),n=>n.shady);vs.push(v)}
  vs.forEach(v=>v.villain=true);
  S={day:1,rep:50,unrest:14,cases:[],next:[],idx:0,verdicts:[],history:[],notes:[],noteSeq:0,heard:{},heardSeq:0,snap:[],phase:"morning",
     stats:{solved:0,wrong:0,shelved:0,unexplained:0}};
}
const free=()=>N.filter(n=>!n.jailed);
function relOf(a,b){if(a===b)return null;if(a.fam.some(f=>f.id===b.id))return "family";if(a.friends.includes(b.id))return "friend";if(a.rivals.includes(b.id))return "rival";return null}
const famLabel=(a,b)=>(a.fam.find(f=>f.id===b.id)||{}).label;
const trustLvl=r=>r<30?"hostile":r<60?"wary":r<80?"friendly":"confidant";
const tags=n=>[...n.pub,...n.hid];
function attrsOf(n,visibleOnly){
  const a=[];
  if(n.build!=="average")a.push(n.build);
  if(n.height!=="average")a.push(n.height);
  if(n.hand==="left")a.push("left");
  if(n.pipe)a.push("pipe");
  (visibleOnly?n.pub:tags(n)).forEach(t=>a.push("tag:"+t));
  return a;
}
function fits(n,k){
  if(k.startsWith("tag:"))return tags(n).includes(k.slice(4));
  if(k==="left")return n.hand==="left";
  if(k==="pipe")return n.pipe;
  return n.build===k||n.height===k;
}
const titleOf=(c)=>typeof c.crime.t==="function"?c.crime.t(c.victim):c.crime.t;

/* ================= pacing ================= */
function tierFor(d){
  const r=Math.random();
  if(d<=4)return "petty";
  if(d<=6)return r<.5?"petty":"serious";
  if(d<=12)return r<.15?"petty":r<.85?"serious":"grave";
  if(d<=15)return r<.5?"grave":"serious";
  return r<.78?"grave":"serious";
}
const casesFor=d=>d===1?1:d<=12?2:3;
function riteF(){return !S||!S.rite?1:S.rite.stage>=4?0:1}
const superChance=d=>(d<=4?0:d<=6?((S&&S.superCount)?0:.12):Math.min(.36,.05+.018*d))*riteF();
const reportsFor=d=>Math.floor((d<12?1:2)*riteF());

/* ================= case generation ================= */
function genCase(day){
  const tier=tierFor(day);
  if(Math.random()<superChance(day)){const c=genSuper(day,tier);if(c){S.superCount=(S.superCount||0)+1;return c}}
  return genHuman(day,tier)||(day>3?genSuper(day,tier):null);
}
function pickReasons(c){
  const pool=shuffle(c.kind==="super"?SUPER_REASONS:REASONS);let i=0;
  return c.suspects.map(s=>{
    if(relOf(s,c.victim)==="rival")return "Named by the complainant.";
    if(c.kind==="super"&&tags(s).includes("occult")&&s.pub.includes("occult"))return "Named by neighbors.";
    return pool[i++%pool.length];
  });
}
function genHuman(day,tier,opt={}){
  for(let tries=0;tries<300;tries++){
    const pool=free();if(pool.length<4)return null;
    const gang=[S.heist&&S.heist.boss,S.heist&&S.heist.mate,S.art&&S.art.thief,S.art&&S.art.fence];
    const vil=pool.filter(n=>n.villain&&n.id!==8);
    let cand=tier==="grave"&&vil.length?vil:pool;
    if(tier==="serious")cand=cand.filter(n=>n.id!==8);
    const w=n=>tier==="petty"?Math.sqrt(n.shady)*((n.villain||gang.includes(n))?.45:1):n.shady*(n.villain?2:1)*(n.id===8?.35:1);
    const culprit=opt.culprit||wpick(cand,w);
    const others=pool.filter(n=>n!==culprit);
    const riv=others.filter(n=>culprit.rivals.includes(n.id));
    const victim=opt.victim&&others.includes(opt.victim)?opt.victim:riv.length&&Math.random()<.5?rnd(riv):rnd(others);
    const attrs=attrsOf(culprit,day<=4);
    if(attrs.length<2)continue;
    const n=Math.min(attrs.length,tier==="petty"?2:tier==="serious"?(Math.random()<.5?2:3):3);
    const hiddenK=attrs.filter(k=>k.startsWith("tag:")&&culprit.hid.includes(k.slice(4)));
    const keys=[...shuffle(attrs.filter(k=>!hiddenK.includes(k))).slice(0,n-(hiddenK.length&&Math.random()<.5?1:0))];
    if(keys.length<n&&hiddenK.length)keys.push(rnd(hiddenK));
    if(keys.length<2)continue;
    const innPool=others.filter(x=>x!==victim);
    const inns=innPool.map(x=>({x,s:keys.filter(k=>fits(x,k)).length+(x.rivals.includes(victim.id)?1:0)+Math.random()*1.4}))
      .sort((a,b)=>b.s-a.s).slice(0,2).map(o=>o.x);
    if(inns.length<2)continue;
    if(inns.some(x=>keys.every(k=>fits(x,k)))&&(day<=6||Math.random()<.7))continue;
    let misleading=null;
    if(day>=8&&Math.random()<.2){
      const target=rnd(inns),opts=attrsOf(target,false).filter(k=>!fits(culprit,k)&&!keys.includes(k));
      if(opts.length){misleading=rnd(opts);keys[Math.floor(Math.random()*keys.length)]=misleading}
    }
    const clueTexts=keys.map(k=>({text:rnd(CLUES[k]),eerie:false}));
    if(day>=10&&Math.random()<.15)clueTexts.push({text:rnd(EERIE),eerie:true});
    if(day>=2&&Math.random()<.55)clueTexts.push({text:rnd(NOISE),eerie:false});
    let named=[culprit,...inns],outsider=false;
    if(!opt.crime&&day>=6&&Math.random()<Math.min(.14,.04+.005*day)){
      const spare=innPool.filter(x=>!inns.includes(x));
      if(spare.length){named=[wpick(spare,x=>1+keys.filter(k=>fits(x,k)).length),...inns];outsider=true}
    }
    const crPool=CRIMES[tier].filter(k=>!k.late||day>=13),crLate=crPool.filter(k=>k.late);
    let crimeP=opt.crime||(crLate.length&&Math.random()<Math.min(.8,(day-12)*.12)?rnd(crLate):rnd(crPool.filter(k=>!k.late)));
    if(!opt.crime&&culprit.id===8&&tier!=="petty"){const am=CRIMES.grave.filter(k=>k.n==="Attempted murder"&&(!k.late||day>=13));if(tier!=="grave"||!am.length)continue;crimeP=rnd(am)}
    const c={kind:"human",tier,culprit,victim,suspects:shuffle(named),keys,clues:shuffle(clueTexts),crime:crimeP,misleading,outsider};
    c.witness=genWitness(c);c.reasons=pickReasons(c);
    if(!opt.crime&&day>=5&&!outsider&&Math.random()<.09){c.murky=true;const shared=attrsOf(culprit,true).filter(k=>c.suspects.every(x=>fits(x,k)));
      c.clues=shuffle([...shuffle(NOISE).slice(0,2).map(t=>({text:t,eerie:false})),...(shared.length?[{text:rnd(CLUES[rnd(shared)]),eerie:false}]:[])]);
      c.witness=Math.random()<.5?null:c.witness&&c.witness.kind==="hint"?null:c.witness}
    return c;
  }
  return null;
}
function genSuper(day,tier){
  const pool=free();if(pool.length<4)return null;
  const victim=rnd(pool),others=pool.filter(n=>n!==victim);
  const suspects=[];
  while(suspects.length<3){
    const s=wpick(others.filter(o=>!suspects.includes(o)),o=>(o.pub.includes("occult")?1.8:1)+(o.rivals.includes(victim.id)?2:0)+o.shady*.5);
    suspects.push(s);
  }
  const clues=shuffle(EERIE).slice(0,day>=12?1:2).map(t=>({text:t,eerie:true}));
  // mundane clues come from different suspects, so they point in different directions
  const hs=shuffle(suspects).slice(0,day>=12?2:1),used=[];
  hs.forEach(h=>{const hk=attrsOf(h,day<=6).filter(k=>!used.includes(k)&&!hs.filter(o=>o!==h).some(o=>fits(o,k)));if(hk.length){const k=rnd(hk);used.push(k);clues.push({text:rnd(CLUES[k]),eerie:false})}});
  if(Math.random()<.5)clues.push({text:rnd(NOISE),eerie:false});
  const c={kind:"super",tier:tier==="petty"?"serious":tier,culprit:null,victim,suspects:shuffle(suspects),keys:[],clues:shuffle(dedupe(clues)),crime:rnd(SUPER)};
  c.witness=genWitness(c);c.reasons=pickReasons(c);
  return c;
}
function dedupe(cl){const s=new Set();return cl.filter(c=>!s.has(c.text)&&s.add(c.text))}
function genWitness(c){
  const pool=free().filter(x=>!c.suspects.includes(x)&&x!==c.victim);
  if(!pool.length)return null;
  const fam=pool.filter(w=>c.suspects.some(s=>relOf(w,s)==="family"));
  const riv=pool.filter(w=>c.suspects.some(s=>relOf(w,s)==="rival"));
  const r=Math.random();
  if(fam.length&&r<.3){const w=rnd(fam);return {n:w,kind:"vouch",about:c.suspects.find(s=>relOf(w,s)==="family")}}
  if(riv.length&&r<.5){const w=rnd(riv);return {n:w,kind:"accuse",about:c.suspects.find(s=>relOf(w,s)==="rival")}}
  const w=rnd(pool);
  if(c.kind==="super")return {n:w,kind:"eerie",text:rnd(["I saw a pale light by the door, drifting like a lantern with nobody carrying it.","I heard singing, very faint, in no language I know.","The air went cold as a cellar, and then I heard something laugh.","I saw a figure, but when I raised my lamp there was no one."])};
  const spare=attrsOf(c.culprit,false).filter(k=>!c.keys.includes(k));
  const trueKey=spare.length?rnd(spare):rnd(attrsOf(c.culprit,false));
  const innocents=c.suspects.filter(s=>s!==c.culprit);if(!innocents.length)innocents.push(rnd(c.suspects));
  const wrongOpts=innocents.flatMap(s=>attrsOf(s,false)).filter(k=>!fits(c.culprit,k));
  return {n:w,kind:"hint",trueKey,falseKey:wrongOpts.length?rnd(wrongOpts):trueKey,alibi:rnd(innocents),said:null};
}

/* ================= gossip ================= */
function hintQuote(who,c){
  const v=c.victim;
  return rnd([`${who.name} was hanging about ${v.name}'s ${v.place} after dark.`,`${who.name} has been muttering about ${v.name} at the lunchroom.`,`${who.name} asked me, casual-like, when ${v.name} usually locks up.`,`I saw ${who.name} watching ${v.name}'s ${v.place} from across the lane.`]);
}
function hear(src,text,about,apply=null){
  const h={hid:++S.heardSeq,src:src?src.id:null,text,about:about.map(a=>a.id),apply,noted:false};
  S.heard[h.hid]=h;return h;
}
function noteDown(hid){
  const h=S.heard[hid];if(!h||h.noted)return;
  h.noted=true;if(h.apply)h.apply();
  addNote(h.src!=null?N[h.src]:null,h.text,h.about.map(i=>N[i]));
}
function addNote(src,text,about,extra={}){
  const note={id:++S.noteSeq,day:S.day,src:src?src.id:null,text,about:about.map(a=>a.id),pinned:false,...extra};
  S.notes.push(note);return note;
}
function gossip(src,cases,{allowOwn=false}={}){
  // returns a note, or null
  const out=[];
  const humans=cases.filter(c=>c.kind==="human");
  const opts=[];
  if(humans.length)opts.push("hint","hint");
  opts.push("secret","tag");
  for(const kind of shuffle(opts)){
    if(kind==="hint"){
      const c=rnd(humans);let target=c.culprit;
      if(target===src||relOf(src,target)==="family"){ // protect self or family: blame a rival instead
        const rv=free().filter(x=>src.rivals.includes(x.id)&&x!==c.victim);
        if(!rv.length)continue;target=rnd(rv);
      }else if(relOf(src,target)==="friend")continue;
      else if(src.rel<75&&Math.random()<.2){const rv=free().filter(x=>src.rivals.includes(x.id)&&x!==c.victim);if(rv.length)target=rnd(rv)}
      return hear(src,hintQuote(target,c),[target,c.victim]);
    }
    if(kind==="secret"){
      let pool=free().filter(x=>x!==src&&relOf(src,x)!=="family");
      const rv=pool.filter(x=>src.rivals.includes(x.id));
      if(rv.length&&Math.random()<.7)pool=rv;
      if(!pool.length)continue;
      const t=rnd(pool);
      return hear(src,`Between us, ${t.name} ${t.secret}.`,[t]);
    }
    if(kind==="tag"){
      const pool=free().filter(x=>x!==src&&x.hid.length);
      if(!pool.length)continue;
      const t=rnd(pool),h=rnd(t.hid);
      return hear(src,`Did you know ${t.name} ${TAGQ[h]}?`,[t]);
    }
  }
  return null;
}
function adj(n,d){if(n.id===MAYOR&&d<0)d*=.5;n.rel=clamp(n.rel+d)}
function revealSecret(t){t.secretKnown=true;t.hid.forEach(h=>t.known.add(h))}
function firstPerson(s){
  return s.replace(/^owes /,"owe ").replace(/^slips /,"slip ").replace(/^took /,"took ").replace(/^meets /,"meet ").replace(/^sells /,"sell ")
   .replace(/^copies /,"copy ").replace(/^lost his /,"lost my ").replace(/^poaches /,"poach ").replace(/^keeps /,"keep ").replace(/^takes /,"take ")
   .replace(/^writes /,"write ").replace(/^isn't /,"am not ").replace(/^fences /,"fence ").replace(/^holds /,"hold ").replace(/^leaves /,"leave ").replace(/^ferries /,"ferry ")
   .replace(/her father would disown her/,"my father would disown me").replace(/his hands shake/,"my hands shake").replace(/\band wants\b/,"and want").replace(/\band is wanted\b/,"and am wanted").replace(/\bshe calls\b/,"I call").replace(/who she says she is/,"who I say I am").replace(/in his cart/,"in my cart").replace(/\band sells\b/,"and sell");
}

function checkEnd(){
  if(S.rep<=0)return "badge";
  if(S.unrest>=100)return "unrest";
  if(!N[MAYOR].jailed&&N[MAYOR].rel<=0)return "mayor";
  return null;
}

function setupHeist(){
  const boss=wpick(N.filter(n=>n.villain),n=>n.shady);

  const mate=pals.length?wpick(pals,n=>n.shady+(boss.friends.includes(n.id)?2:0)):rnd(N.filter(n=>n!==boss&&n.id!==8));
  const ti=Math.floor(Math.random()*HEIST_TARGETS.length);

  S.heist={target:HEIST_TARGETS[ti],crime:HEIST_CRIMES[ti],boss,mate,preps,day:12,resolved:false,stopped:false,news:null};
}

function setupArt(){
  const H=S.heist,avoid=[H.boss,H.mate];
  const pool=N.filter(n=>!avoid.includes(n)&&n.id!==8&&n.shady>=1.4);
  const thief=wpick(pool.length?pool:N.filter(n=>!avoid.includes(n)),n=>n.shady);
  const fp=N.filter(n=>n!==thief&&n.id!==8&&!avoid.includes(n)&&(thief.friends.includes(n.id)||n.shady>=1.8));
  const fence=fp.length?rnd(fp):rnd(N.filter(n=>n!==thief&&n.id!==8&&!avoid.includes(n)));
  S.art={thief,fence,stages:[{crime:ART_CRIMES[0],day:10,by:thief,tier:"grave"},{crime:ART_CRIMES[1],day:13,by:fence,tier:"serious"},{crime:ART_CRIMES[2],day:16,by:thief,tier:"grave"}].map(x=>({...x,solved:false,done:false})),day:19,resolved:false,news:null};
}
function vigLeader(){const h=N[6],k=N[7];return !h.jailed?h:!k.jailed?k:null}
function genDay(d){
  const list=[],H=S.heist,A=S.art,V=S.vig;
  if(V&&V.outcome==="frenzy"&&!V.killed){V.killed=true;const t=N[V.target];t.dead=d;t.jailed=true;t.jailUntil=0;V.deadName=t.name;
    const killer=!N[7].jailed?N[7]:!N[6].jailed?N[6]:null,finder=[N[8],N[10],N[16]].find(x=>!x.jailed&&x!==killer);
    S.unrest=clamp(S.unrest+20);S.rep=clamp(S.rep-12);
    if(killer&&finder){const c=genHuman(d,"grave",{culprit:killer,crime:VIG_CRIMES[0],victim:finder});if(c){c.vig="murder";list.push(c)}}}
  if(V&&V.beating&&d===V.beatDay&&!N[7].jailed){const vic=[N[13],N[16],N[11],N[9]].find(x=>!x.jailed);if(vic){const c=genHuman(d,"grave",{culprit:N[7],crime:VIG_CRIMES[1],victim:vic});if(c){c.vig="beating";list.push(c)}}}
  if(A&&!A.resolved&&d===A.day){
    A.resolved=true;
    const stopped=A.thief.jailed||A.stages.filter(x=>x.solved).length>=2;
    A.news=stopped?"recovered":"lost";
    if(!stopped){const c=genHuman(d,"grave",{culprit:A.thief.jailed?A.fence:A.thief,crime:ART_CRIMES[3],victim:N[16]});if(c){c.art=true;list.push(c)}}
  }
  const st=A&&!A.resolved&&A.stages.find(x=>x.day===d);
  if(st){const by=!st.by.jailed?st.by:[A.thief,A.fence].find(x=>!x.jailed);
    if(by){const c=genHuman(d,st.tier,{culprit:by,crime:st.crime,victim:N[st.crime.vict]});if(c){c.artStage=st;st.by=by;st.done=true;list.push(c)}}}
  if(H&&!H.resolved&&d===H.day){
    H.resolved=true;
    H.stopped=H.boss.jailed||H.preps.filter(p=>p.solved).length>=2||(H.boss.jailed&&H.mate.jailed);
    if(H.stopped){H.news="foiled"}
    else{H.news="robbed";const c=genHuman(d,"grave",{culprit:H.boss,crime:H.crime,victim:N[H.target.vict]});if(c){c.heist=true;list.push(c)}}
  }
  const prep=H&&H.preps.find(p=>p.day===d);
  if(prep&&!H.resolved){
    const by=!prep.by.jailed?prep.by:[H.boss,H.mate].find(x=>!x.jailed);
    if(by){const c=genHuman(d,"serious",{culprit:by,crime:prep.crime,victim:N[prep.crime.vict]});if(c){c.prep=prep;prep.by=by;prep.done=true;list.push(c)}}
  }
  while(list.length<casesFor(d)){const c=genCase(d);if(c)list.push(c);else break}
  return shuffle(list);
}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const fullDate=d=>{const x=dateOf(d);return `${WDAYS[x.getDay()]}, ${MONTHS[x.getMonth()]} ${x.getDate()}, 1931`};
const shortD=d=>{const x=dateOf(d);return `${MONTHS[x.getMonth()].slice(0,3)}. ${x.getDate()}`};
const nbDate=d=>{const x=dateOf(d);return `${WDAYS[x.getDay()].slice(0,3)}., ${MONTHS[x.getMonth()].slice(0,3)}. ${x.getDate()}`};
function clockAt(i,count){const m=8*60+20+Math.round(i*(8*60+10)/Math.max(count,1)),h=Math.floor(m/60);return `${((h+11)%12)+1}:${String(m%60).padStart(2,"0")} ${h<12?"a.m.":"p.m."}`}
const lowAddr=a=>/^(The|Rooms|Rear|Office|Shack|Show|Sexton's|Ferry)\b/.test(a)?a[0].toLowerCase()+a.slice(1):a;
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const surname=n=>{const w=n.name.replace(/^(Mrs\.|Dr\.|Father|Madame)\s+/,"").split(" ");return w[w.length-1]};
const initials=n=>{const w=n.full.replace(/^Rev\.\s*/,"").replace(/,.*$/,"").replace(/\(.*\)/,"").trim().split(/\s+/);return w.length>1?`${w[0][0]}.${w[w.length-1][0]}.`:`${w[0][0]}.`};
const his=n=>n.sex==="f"?"her":"his",him=n=>n.sex==="f"?"her":"him",he=n=>n.sex==="f"?"she":"he",He=n=>n.sex==="f"?"She":"He";

function councilScore(st=S.stats,rep=S.rep){const t=st.solved+st.wrong+st.shelved+st.unexplained;return t<2?rep:Math.round(successRate(st)*.8+rep*.2)}

function startGame(name){
  reading=false;picker=null;if(G.tc)G.tc={};clearVisitor();G.lampOff=false;TALK=null;
  newGame();
  N.forEach(n=>{
    const f=n.sex==="f",kid=n.age===14;
    const H={f:{short:[59,62],average:[63,66],tall:[68,70]},m:{short:[62,65],average:[67,70],tall:[72,75]}}[n.sex][n.height];
    const W={f:{slight:[98,118],average:[126,150],heavy:[172,205]},m:{slight:[118,138],average:[150,176],heavy:[198,238]}}[n.sex][n.build];
    const r=([a,b])=>a+Math.floor(Math.random()*(b-a+1));
    n.ht=kid?59:r(H);n.wt=kid?84:r(W);
  });
  Object.assign(S,{name:name||null,saveId:name?("s"+Date.now().toString(36)):null,visit:null,desk:[],say:"",slips:[],call:null,memo:[],pages:{},printed:new Set(),record:{},caseNo:30,nbLeft:null,paper:null});
  S.sgt=55;
  S.wind=Array.from({length:DAYS},(_,i)=>{const b=i>=17?.92+i*.004:Math.pow(i/17,1.5)*.85;return Math.min(1,b+(Math.random()<.3&&i<17?.18+Math.random()*.22:0))});
  S.blackoutDay=12+Math.floor(Math.random()*7);S.coffee=4;
  setupHeist();setupArt();
  S.vig={formDay:11,mobDay:13,beating:Math.random()<.5,beatDay:16,target:null,outcome:null,deadName:null};
  S.rite={stage:0,story:rnd(RITES),partner:Math.random()<.5?15:12,correct:0,justDone:false,v2:true};

}

function morning(firstDay){
  S.phase="day";S.idx=0;S.verdicts=[];S.snap=N.map(n=>n.rel);S.memo=[];
  const back=[];N.forEach(n=>{if(n.jailUntil&&S.day>=n.jailUntil){n.jailed=false;n.jailUntil=0;adj(n,-10);back.push(n)}});
  const prev=S.history[S.history.length-1];
  const reports=shuffle(STRANGE).slice(0,reportsFor(S.day));
  if(!firstDay)S.unrest=clamp(Math.max(S.unrest+2+2*reports.length,unrestFloor(S.day)));
  const H=S.heist;
  const A=S.art;if(A&&A.news&&!A.applied){A.applied=true;if(A.news==="recovered"){S.rep=clamp(S.rep+14);S.unrest=clamp(S.unrest-10)}else{S.rep=clamp(S.rep-12);S.unrest=clamp(S.unrest+14)}}
  if(H&&H.news&&!H.applied){H.applied=true;if(H.news==="foiled"){S.rep=clamp(S.rep+15);S.unrest=clamp(S.unrest-15)}else{S.rep=clamp(S.rep-15);S.unrest=clamp(S.unrest+20)}}
  S.history.push({day:S.day,cases:[],visited:null,reports});
  S.paper=buildPaper(prev,reports);
  S.visit=S.name?planVisit():null;S.eveVisit=null;S.coffee=sgtMood()>=38?4:1;S.weakCoffee=sgtMood()<38;S.letterGiven=S.letterGiven||false;S.reportGiven=false;S.creeps=0;
  S.queue=[];
  if(S.name){
    if(firstDay){S.queue.push({kind:"superior"});S.queue.push({kind:"tutorial"})}
    const V=S.vig;if(V&&S.day===V.mobDay&&V.formed&&vigLeader()){let t=[12,15].map(i=>N[i]).filter(x=>!x.jailed);if(!t.length)t=[13,11].map(i=>N[i]).filter(x=>!x.jailed);if(t.length){const tg=t.length>1?(t[0].id===12&&Math.random()<.6?t[0]:rnd(t)):t[0];V.target=tg.id;S.queue.push({kind:"mob",target:tg.id})}}
    if(S.visit&&S.visit.when==="morning")S.queue.push(S.visit);
    else if(S.visit)S.eveVisit=S.visit;
    S.cases.forEach((c,i)=>S.queue.push({kind:"complaint",ci:i}));
  }
  if(!firstDay){S.desk=[];S.say=weatherLine()+(S.weakCoffee?" Obermeyer only made half a cup of coffee this morning.":"")+(back.length?` ${back.map(n=>n.name).join(" and ")} ${back.length>1?"are":"is"} back in town, let out by the county.`:"")}
  if(S.unrest>=100){finish("unrest");return}
  refresh();
  if(!firstDay)saveGame();
}

function storyFor(c){

  switch(c.outcome){
    case "guilty":{
      const head=tiny?[`${SUR} LET OFF WITH WARNING`,`${SUR} FINED`,`${SUR} GIVEN THREE DAYS`][sev]
        :c.tier==="serious"?[`${SUR} FINED AND RELEASED`,`${SUR} HELD ON ${c.crime.n.toUpperCase()} CHARGE`,`${SUR} HELD WITHOUT BAIL`][sev]
        :[`${SUR} HELD; BAIL SET`,`${SUR} HELD ON ${c.crime.n.toUpperCase()} CHARGE`,`STATE TO ASK MAXIMUM FOR ${SUR}`][sev];
      const decks=[`Admits Guilt in ${T} Case`];
      if(c.outsider)decks.push("Detective Looked Beyond Those First Named");
      if(!tiny&&sev===0)decks.push("Leniency Questioned on Main Street");
      if(tiny&&sev===2)decks.push("Some Call Sentence Harsh");
      return {rank:tiny?1:c.tier==="grave"?5:3,head,decks,body:`${dl} ${cap(w.press)}${typeof w.age==="number"?`, ${w.age},`:""} was ${SENT[c.tier][sev]} yesterday in the matter of ${nat} complained of by ${vp}. ${c.tier==="grave"?"The affair has shocked the community.":tiny?"":`${He(w)} is said to have made a full confession.`}`};}
    case "wrong":return {rank:4,head:`CHARGE AGAINST ${SUR} DROPPED`,decks:[sev===2?"Harsh Treatment of Innocent Party Condemned":"Detective's Error Stirs Talk on Main Street"],body:`${dl} ${cap(w.press)} was released last evening when the case against ${him(w)} in the ${nat} complaint of ${vp} fell apart.${sev===2?` That the officer had asked the heaviest penalty has made matters worse.`:""} Friends of ${w.called==="Madame"?"the woman":w.press} are said to be indignant, and the true culprit is thought to be at large.`};
    case "shelved":return {rank:2,head:`NO ARREST IN ${T.toUpperCase()}`,decks:[`${cap(vp)} Voices Dissatisfaction`],body:`The complaint of ${nat} made by ${vp} remains unanswered. ${cap(vp)} told a Courier reporter the matter "appears to have been dropped."`};
    case "spirits":return {rank:3,head:`DETECTIVE CITES "NO HUMAN HAND"`,decks:[`Ruling in ${T} Case Draws Ridicule`],body:`Some amusement and more annoyance greeted the officer's report that no living person was responsible for the ${nat} complained of by ${vp}. "Ghosts don't pry open doors," one merchant remarked.`};
    case "unexplained":return {rank:3,head:`STRANGE AFFAIR AT ${surname(v).toUpperCase()} PLACE`,decks:["Officer Finds No Human Agency","Many Uneasy"],body:`The detective has closed the complaint of ${vp} with the finding that no person could be held responsible. The finding has done little to quiet talk in the town.`};
  }
  return null;
}
function buildPaper(prev,reports){
  const d=S.day,paper={weather:rnd(WEATHER_BY[weatherOf(S.day)]),stories:[],strange:reports,personal:[],ads:shuffle(ADS).slice(0,2),vol:57,no:61+d};
  let lead;
  if(!prev){
    lead={head:"COUNTY DETECTIVE TAKES POST HERE",decks:["Mayor Crane Welcomes Officer to Town Hall","Council Hopes for End to Recent Troubles"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> A detective of the county sheriff's office took up quarters at the town hall this morning, at the request of Mayor Elias J. Crane and the council. The mayor told the Courier he expected "an end to the petty troubles of the winter, and a quick one." The officer is to serve a trial period of twenty days. Opinion on Front Street is divided.`};
  }else{
    const st=prev.cases.map(r=>storyFor(r.ref)).filter(Boolean).sort((a,b)=>b.rank-a.rank);
    lead=st.shift()||{head:"COUNCIL AGAIN DEFERS ROAD QUESTION",decks:["No Arrests Reported Yesterday"],body:"The town council met in regular session last evening and again put off the question of graveling the River Road."};
    paper.stories=st;
  }
  const H=S.heist,A=S.art;
  const V=S.vig;
  if(V&&V.killed&&!V.printedKill){V.printedKill=true;if(prev)paper.stories.unshift(lead);
    lead={head:`MOB KILLS ${(V.deadName||"").toUpperCase().replace(/^MADAME /,"")}`,decks:["Committee Men Drag Victim From Station Door","Town Stunned; No Arrests Yet"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> ${V.deadName} is dead. A crowd of the so-called Citizens' Committee took ${V.deadName} from the door of the marshal's station yesterday morning, after the detective refused to hold ${V.deadName.startsWith("Crow")||V.deadName.startsWith("Silas")?"him":"her"}, and the body was found at first light by the river. The committee's founder, Hugo Brandt, could not be found for comment. Several families are said to have packed and left before noon.`};
  }else if(V&&V.outcome==="stoodDown"&&!V.printedDown){V.printedDown=true;paper.stories.unshift({head:"COMMITTEE STANDS DOWN",decks:["Detective Turns Away Crowd at Station Door"],body:"A crowd of the Citizens' Committee which brought a woman to the marshal's station yesterday dispersed peaceably when the detective refused to hold her. Hugo Brandt, the committee's founder, said afterward that he was \"satisfied the law is in good hands.\""})}
  else if(V&&V.outcome==="appeased"&&!V.printedApp){V.printedApp=true;paper.stories.unshift({head:"COMMITTEE HANDS OVER SUSPECT",decks:["Woman Held Without Charge"],body:"A woman brought to the marshal's station by the Citizens' Committee yesterday is being held in the cells, though no charge has been entered. Some call it prudence. Others do not."})}
  if(d===11&&V&&!V.printedForm){V.printedForm=true;paper.stories.unshift({head:"CITIZENS TO MEET TONIGHT",decks:["Brandt Calls for Night Patrols"],body:"Hugo Brandt, blacksmith, has called a meeting of \"all able-bodied men\" at the Odd Fellows hall this evening to form a committee for the patrol of the streets. \"The law needs help,\" Mr. Brandt told the Courier. \"We mean to give it.\""})}
  if(A&&A.news&&!A.printed){A.printed=true;if(prev)paper.stories.unshift(lead);
    lead=A.news==="recovered"?{head:"STOLEN PAINTINGS RECOVERED",decks:["Ashby Madonna Found Wrapped in Oilcloth","Plan to Ship Art to Chicago Foiled"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> The Madonna taken from St. Brendan's, and the Dutch landscape cut from its frame at the Ashby house, were found this morning wrapped in oilcloth and ready for shipping. Mrs. Ashby is said to have wept, which those who know her find hard to credit.`}
      :{head:"ASHBY PAINTINGS LEAVE TOWN",decks:["Crates Crossed on the Night Ferry","Chicago Dealers Said to Be Waiting"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> The paintings stolen from St. Brendan's and the Ashby house are believed to have left Hollow Creek last night by the ferry, bound for Chicago. Mrs. Ashby has engaged a Pinkerton man at her own expense, and has said what she thinks of the local officers.`};
  }else if(H&&H.news&&!H.printed){
    H.printed=true;if(prev)paper.stories.unshift(lead);
    lead=H.news==="foiled"?{head:`${H.target.head} ROBBERY FOILED`,decks:["Gang's Plans Came to Nothing","Detective's Work Credited"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> An attempt on ${H.target.name} came to nothing last night. Tools, papers and keys taken in a string of thefts over the past fortnight are now believed to have been gathered for the purpose. The council met at seven this morning to pass a vote of thanks.`}
      :{head:`${H.target.head} ROBBED; ${H.target.loot} TAKEN`,decks:["Burglars Work Undisturbed Through the Night","Recent Thefts Now Seen as Preparation"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> ${cap(H.target.name)} was broken open in the small hours and ${H.target.loot} carried off. The string of thefts these past two weeks, of tools, papers and keys, is now seen for what it was. Feeling against the town's officers runs high.`};
  }else if(S.rite&&S.rite.justDone){
    S.rite.justDone=false;
    if(prev)paper.stories.unshift(lead);
    lead={head:"STRANGE DOINGS CEASE",decks:[`Quiet Night at ${titleCase(S.rite.story.place.replace(/^the /,""))}`,"Residents Breathe Easier"],body:`<span class="dl">Hollow Creek, ${shortD(d)}.</span> For the first time in some weeks, no report of queer sights or sounds reached the Courier overnight. A light was seen moving at ${S.rite.story.place} late last evening, and some claim to have heard singing. Two figures were seen walking home near midnight, carrying a lantern, and would say nothing to a Courier reporter.`};
  }
  paper.lead=lead;
  paper.stories.push(rnd(BRIEFS.filter(b=>!b.wet||["rain","heavy","storm"].includes(weatherOf(S.day)))));
  if(d>=13){shuffle(LATE_BRIEFS).slice(0,d>=17?2:1).forEach(b=>paper.stories.unshift(b))}
  if(A&&!A.resolved&&A.stages[0].done&&!A.fakePrinted){A.fakePrinted=true;paper.stories.unshift({head:"PRICED MADONNA A FAKE",decks:["Ashby Treasure Swapped for Copy","Church Silent on Discovery"],body:"The painting of the Madonna lent to St. Brendan's by Mrs. Eudora Ashby, and said to be worth several thousand dollars, has been found to be a skilful copy. When the original was taken, and by whom, is not known. Mrs. Ashby has other pictures in her house, and is said to have bought new locks."})}
  if(A&&!A.resolved&&A.stages[2].done&&!A.frame2Printed){A.frame2Printed=true;paper.stories.push({head:"SECOND ASHBY PICTURE TAKEN",decks:["Thief Cut Canvas From Frame"],body:"A second painting belonging to Mrs. Ashby has been stolen, this time from her own house. Those who know such things say a thief who cuts a canvas from its frame means to sell it far away."})}
  if(H&&!H.resolved&&H.preps.filter(p=>p.done).length>=2)paper.stories.push({head:"THEFTS CONTINUE",decks:["Tools and Papers Missing"],body:"Another of the odd thefts that have troubled the town these past days was reported yesterday. Nothing of great value has gone, which some find more worrying than if it had. A bank at Anamosa was robbed in January after a similar run of small thefts."});
  const vics=[...new Set(S.cases.map(c=>c.victim.press))];
  if(vics.length)paper.stories.push({head:"COMPLAINTS LODGED",decks:[],body:`Complaints were lodged at the town hall early this morning by ${vics.length>1?vics.slice(0,-1).join(", ")+" and "+vics[vics.length-1]:vics[0]}. The detective declined to state their nature.`});
  const pairs=[...FRIENDS.map(p=>["f",...p]),...RIVALS.map(p=>["r",...p])].filter(([k,a,b])=>!S.printed.has(`${k}${a}-${b}`)&&!N[a].jailed&&!N[b].jailed);
  const usedT=new Set();
  shuffle(pairs).slice(0,2).forEach(([k,a,b])=>{
    S.printed.add(`${k}${a}-${b}`);const A=N[a].press,B=N[b].press;
    const pickT=list=>{const f=list.filter((t,i)=>!usedT.has(k+i));const t=rnd(f.length?f:list);usedT.add(k+list.indexOf(t));return t};
    paper.personal.push(k==="f"?pickT([`${cap(A)} and ${B} were seen fishing below the ferry landing Sunday.`,`${cap(A)} took Sunday dinner with ${B}.`,`${cap(A)} called on ${B}, who has been indisposed.`,`${cap(A)} and ${B} drove together to the county seat Thursday on business.`])
      :pickT([`${cap(A)} and ${B} are said to be not on speaking terms since a disagreement at the Lenten supper.`,`Words passed between ${A} and ${B} on Front Street Saturday, to the interest of passers-by.`,`${cap(A)} is understood to have taken ${B} to task over a matter of money.`,`${cap(A)} was heard to remark that ${B} "would not be missed."`]));
  });
  shuffle(FILLER).slice(0,2).forEach(f=>paper.personal.push(f));
  paper.personal=shuffle(paper.personal);
  return paper;
}

/* ================= documents ================= */
function letterDoc(){
  return `<article class="paper letter">
    <div class="head"><b>OFFICE OF THE SHERIFF</b>Wapsie County, Iowa</div>
    <p style="text-align:right">${fullDate(1)}</p>
    <p>Dear Detective ${esc(S.name||"")},</p>
    <p>You are hereby assigned to the town of Hollow Creek for a trial period of twenty days, at the request of Mayor Crane and the council. You will work from the front desk of the old town marshal's station. You will find complaints in your in-tray each morning, and a file on every resident in the card index.</p>
    <p>A word of advice. The evidence at a scene will rarely name anyone. You must reason from it to the person, and you will not always be sure. People with complaints will come to you each morning, and others drop in now and then, early or late, and some will tell you a great deal once they trust you, and nothing at all if they don't. They are not above lying for their own kin, or against those they dislike. Whatever you hear, you had better write in your notebook at the end of the day, for no one will say it twice.</p>
    <p>The trouble so far has been small, but I expect it to grow. You will also hear talk of strange things. Most is nonsense. Not all of it. Where you find no human hand in a matter, say so plainly and close it. If it comes to that, someone in town who claims to understand such things may come to you. I leave it to your judgment whether to listen.</p>
    <p>One thing more. The county has had word of a gang working the river towns. They take small things first. Watch for a pattern.</p>
    <p>The council will judge you on results. Charge the wrong person, or let the town's temper get away from you, and I will not be able to keep you there. Bear in mind, too, that the sentence you ask for matters. Too soft on a real villain and the town will say so; too hard on an innocent and they will never forgive you. And do not assume the guilty party is always among those first named.</p>
    <p>Yours faithfully,<br><span class="signed">H. R. Lindqvist</span><br>Sheriff</p>
  </article>`;
}
function trayDoc(){
  if(!S.cases.some(c=>c.reported))return `<p class="deskmsg">Nothing in the tray yet.</p>`;
  return `<div class="folders">${S.cases.map((c,i)=>!c.reported?"":`<button class="folder ${c.filed?"done":""}" data-case="${i}">
    <span class="t">Complaint No. ${c.no}. ${c.crime.n}</span>
    <span class="s">Complainant: ${esc(c.victim.name)}. ${c.filed?"Filed.":"Open."}</span></button>`).join("")}</div>
    ${S.cases.every(c=>c.filed)?`<p class="deskmsg">The in-tray is empty. Put out the lamp when you're ready to finish for the day.</p>`:""}`;
}
function witnessQA(c){
  const w=c.witness;
  if(!w)return `<p class="muted">No witness has come forward.</p>`;
  let q="Q. Did you see anything that night?",a;
  if(w.n.rel<30)return `<p>${nm(w.n)}, ${esc(w.n.addr)}.</p><p class="muted">The witness declined to make a statement.</p>`;
  if(w.kind==="vouch"){q=`Q. Where was ${first(w.about)} that night?`;a=`Home with me, all night. I'd swear to it.`}
  else if(w.kind==="accuse"){q="Q. Have you anything to add?";a=`Only that I'd look hard at ${w.about.name}, if I were you.`}
  else if(w.kind==="eerie")a=w.text;
  else{
    if(!w.said){const wrong=trustLvl(w.n.rel)==="wary"&&Math.random()<.3;w.said={key:wrong?w.falseKey:w.trueKey,alibi:trustLvl(w.n.rel)!=="wary"}}
    a=`I only saw them from behind, but ${SPEECH[w.said.key]}.`;
    if(w.said.alibi)a+=` And ${w.alibi.name} was with me until late, so it wasn't them.`;
  }
  return `<p>${nm(w.n)}, ${esc(w.n.addr)}.</p><div class="qa"><p>${q}</p><p>A. ${a}</p></div>`;
}
function caseDoc(i){

    <div class="frow"><div class="fld"><span class="l">Complainant</span><span class="v">${nm(c.victim)}</span></div></div>
    <div class="frow"><div class="fld"><span class="l">Address</span><span class="v">${esc(c.victim.addr)}</span></div></div>
    <div class="frow"><div class="fld"><span class="l">Nature of complaint</span><span class="v">${c.crime.n}</span></div></div>
    <div class="frow"><div class="fld"><span class="l">Class</span><span class="v">${felony?"Felony":"Misdemeanor"}</span></div></div>
    <div class="sect">PARTICULARS</div>
    <p style="margin:6px 0">${c.crime.d(c.victim)}</p>
    <div class="sect">OBSERVATIONS AT THE SCENE</div>
    <ol class="obs">${c.clues.map(x=>`<li>${x.text}</li>`).join("")}</ol>

    <div class="sect">DISPOSITION</div>

      ${c.suspects.map(s=>R("a"+s.id,`Charge ${esc(s.name)}.`)).join("")}
      ${R("o","Charge a person not named above:",chosen==="o"?otherSel:"")}

    <div class="sign">${c.filed?`<span>Signed</span><span class="signed big">${esc(S.name||"Detective")}</span>`:`<button class="btn" id="fileBtn" ${ready?"":"disabled"}>Sign and file</button><span class="muted">Filing is final.</span>`}</div>

function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}

    const rot=(r(1)-.5)*2.2,dx=r(2)*12,fs=23+Math.round(r(3)*6),ls=((r(4)-.5)*1.4).toFixed(2),op=(.78+r(5)*.22).toFixed(2),sk=((r(6)-.5)*6).toFixed(1);

}

function enc(root){
  const seen=new Map();let nid=0;
  const e=v=>{
    if(v===null||typeof v!=="object")return typeof v==="function"?undefined:v;
    if(N.includes(v))return {$n:v.id};
    const ci=CRIME_ALL.indexOf(v);if(ci>=0)return {$c:ci};
    const ri=RITES.indexOf(v);if(ri>=0)return {$r:ri};
    if(v instanceof Set)return {$set:[...v].map(e)};
    if(seen.has(v))return {$ref:seen.get(v)};
    const id=nid++;seen.set(v,id);
    if(Array.isArray(v))return {$id:id,$a:v.map(e)};
    const o={$id:id};for(const k in v){const x=e(v[k]);if(x!==undefined)o[k]=x}return o;
  };
  return e(root);
}
function dec(root){
  const refs={};
  const d=v=>{
    if(v===null||typeof v!=="object")return v;
    if("$n" in v)return N[v.$n];
    if("$c" in v)return CRIME_ALL[v.$c];
    if("$r" in v)return RITES[v.$r];
    if("$set" in v)return new Set(v.$set.map(d));
    if("$ref" in v)return refs[v.$ref];
    if("$a" in v){const a=[];refs[v.$id]=a;v.$a.forEach(x=>a.push(d(x)));return a}
    const o={};refs[v.$id]=o;for(const k in v)if(k!=="$id")o[k]=d(v[k]);return o;
  };
  return d(root);
}

async function packSaves(){

}

/* ================= visitors ================= */
function partnerNpc(){
  const r=S.rite;let p=N[r.partner];
  if(p.jailed){const alt=[15,12,8].map(i=>N[i]).find(x=>!x.jailed);if(!alt)return null;r.partner=alt.id;p=alt}
  return p;
}
function planVisit(){
  const r=S.rite,p=r&&r.stage<4?partnerNpc():null,pr=r&&r.stage<4&&!N[8].jailed?N[8]:null;
  if(r&&r.stage<4){
    const anySuper=S.history.some(h=>h.cases.some(c=>c.ref&&c.ref.kind==="super"&&c.outcome!=="pending"));
    if(r.stage===0){
      if(!r.ladyMet&&p&&p.id!==8&&p.rel>=25&&((anySuper&&S.day>=5)||S.day>=7))return {when:"evening",npc:p,kind:"mystic",step:"lady0"};
      if((r.ladyMet||!p||p.id===8)&&!r.priestMet&&pr&&pr.rel>=25&&S.day>=5)return {when:"morning",npc:pr,kind:"mystic",step:"priest0"};
    }
    if(r.stage===1&&r.correct>=1){const a=[p,pr].filter(x=>x&&x.rel>=25);if(a.length)return {when:"morning",npc:rnd(a),kind:"mystic",step:"quiz"}}
    if((r.stage===2||r.stage===3)&&r.correct>=1){const a=p&&p.id!==8?p:pr;if(a)return {when:"evening",npc:a,kind:"mystic",step:r.stage===2?"rite1":"rite2"}}
  }
  const x=Math.random();if(x>=.6)return null;
  const pool=free().filter(n=>n.rel>=28&&(!p||n!==p));
  if(!pool.length)return null;
  return {when:x<.3?"morning":"evening",npc:wpick(pool,n=>Math.max(.2,(n.rel-25)/20)),kind:"tip"};
}
function tipsFor(src,cases,morningVisit){
  const out=[],H=S.heist;
  const safe=x=>x&&x!==src&&relOf(src,x)!=="family";
  cases.forEach(c=>{
    if(c.kind!=="human")return;
    const cu=c.culprit,v=c.victim;
    if(!safe(cu))return;
    if(cu.rivals.includes(v.id))out.push({w:5,t:morningVisit?`About ${v.name}'s trouble. I'd not say this to just anyone, but ${cu.name} can't abide ${v.called==="Mrs. Ashby"?"her":v.called}. Never could.`:`I'd keep an eye on ${cu.name}. ${He(cu)} can't abide ${v.name}, and I heard ${him(cu)} say as much only yesterday.`});
    else out.push({w:3,t:morningVisit?`I'll tell you who was out and about the night ${v.name} had that trouble: ${cu.name}. Make of it what you will.`:`${cu.name} was at the lunchroom asking about ${v.name}. What time the ${v.place} gets locked up, that sort of thing.`});
    cu.hid.forEach(h=>out.push({w:c.keys.includes("tag:"+h)?5:2,t:`You didn't hear it from me, but ${cu.name} ${TAGQ[h]}.`}));
    if(c.outsider&&morningVisit)out.push({w:6,t:`They're looking at the wrong folks over ${v.name}'s trouble. I'd want to know where ${cu.name} was.`});
    if(morningVisit)c.suspects.filter(s=>s!==cu&&safe(s)&&s!==src).forEach(s=>out.push({w:2.5,t:`Whatever they're saying about ${s.name}, ${he(s)} was nowhere near it. ${He(s)} was at my place most of that night.`}));
  });
  if(H&&!H.resolved&&S.day>=6){const m=[H.boss,H.mate].filter(x=>safe(x)&&!x.jailed);if(m.length){const x=rnd(m);out.push({w:4,t:`Somebody's been asking a lot of questions about ${H.target.name}. The hours, the locks, who sleeps nearby. It was ${x.name}.`})}}
  const AR=S.art;if(AR&&!AR.resolved&&S.day>=10){const m=[AR.thief,AR.fence].filter(x=>safe(x)&&!x.jailed);if(m.length){const x=rnd(m);out.push({w:4,t:rnd([`${x.name} was asking Jonah whether the ferry takes crates at night. Flat ones.`,`I saw ${x.name} with paint on ${his(x)} cuffs. Oil paint. Now what would ${he(x)} want with that?`,`${x.name} has been writing letters to Chicago. The postmistress told me.`])})}}
  RIVALS.forEach(([a,b])=>{const A=N[a],B=N[b];if(safe(A)&&safe(B))out.push({w:1,t:`Here's something you won't find in any file: ${A.name} really dislikes ${B.name}. Has for years.`})});
  out.forEach(o=>o.w+=Math.random()*1.5);
  const foes=free().filter(x=>src.rivals.includes(x.id)&&x!==src);
  if(foes.length&&Math.random()<.35){const f=rnd(foes),F=f.name;
    const gripe=rnd([`Between you and me, ${F} is a snake. Always has been.`,`I'll say it if nobody else will. ${F} thinks the sun rises for ${him(f)} alone.`,`You know what ${F} did at the church supper? Took the last of the chicken and never said thank you. That's the sort ${he(f)} is.`,`I wouldn't trust ${F} to mind a dog. I've said so to ${his(f)} face.`,`${F} owes half the town money and walks about like ${he(f)} owns the other half.`,`Mark me, ${F} will come to a bad end. I only hope I'm there to see it.`]);
    return [gripe,out.length?out[0].t:`Anyway. That's all. I just had to say it to someone.`]}
  out.sort((a,b)=>b.w-a.w);
  const picked=[];out.forEach(o=>{if(picked.length<2&&!picked.includes(o.t))picked.push(o.t)});
  // now and then, a visitor with a grudge points the wrong way
  if(picked.length&&Math.random()<.12){const rv=free().filter(x=>src.rivals.includes(x.id));if(rv.length){const liar=rnd(rv);picked[0]=`If you want my opinion, whatever's going wrong in this town, ${liar.name} is at the bottom of it.`}}
  return picked;
}
function greet(v){

      choices:[{label:"Thank him",fn:()=>{r.priestMet=true;if(!known)r.ladyMet=true;adj(n,6);bump();endVisit()}},{label:"Ask why a priest keeps such a book",fn:()=>{adj(n,-2);talkMore(`He is quiet for a moment. "Because the men who kept this parish before me found they needed it. Twice. I pray I won't."`,[{label:"See him out",fn:()=>{r.priestMet=true;if(!known)r.ladyMet=true;bump();endVisit()}}])}}]};
  }

    if(!sup.length){return {lines:[greet(v),`"You've been closing its cases, I hear. Good. I'll come back when there's more to talk about."`],choices:[{label:"See them out",fn:()=>endVisit()}]}}

    return {lines:[greet(v),n.id===8?`"Before we go further, I must know you can tell its work from a man's. Which of these was it?"`:`"You've closed some of its doings. Let's see if you know them. Which of these was its work, and not a living hand?"`],

        else{r.correct=Math.max(0,r.correct-1);adj(n,-5);talkMore(`"No. That was a living hand, plain as day." ${He(n)} looks at you a long moment. "You're not ready. Close its cases honestly, and I'll come again."`,[{label:"See them out",fn:()=>endVisit()}])}

  const tryIt=(method)=>{
    const ok=Math.random()<.5,m=method==="old"?who:pr;
    const scene=method==="old"?`You stand in the ${weatherOf(S.day)==="fog"?"fog":"rain"} at ${st.place} while ${who.name} burns herbs in a tin and speaks words you don't know. You do what she tells you: ${wish}.`:`Father Dunn reads by the light of your lamp at ${st.place}, his voice steady, the stole round his neck soaked through. You do as he asks: ${wish}.`;

function act(k){
  S.say="";
  if(!S.name&&k!=="register"&&k!=="pipe"){place("register");return}
  if(G.visitor&&G.visitor.state!=="gone"&&!["pipe","notebook","coffee"].includes(k)){say("Someone is speaking to you.");return}
  switch(k){
    case "tray":case "cards":picker=k;Sound.rustle();refresh();return;
    case "pipe":smoke();return;
    case "coffee":drink();return;
    case "lamp":
      if(S.phase!=="day")return;
      if(busy()){say("There's still someone to see before you finish.");return}
      if(S.cases.some(c=>!c.filed)){say("There are still complaints in the in-tray.");return}
      endWorkday();return;
    case "hat":
      if(S.phase==="day"){say("Not yet. Put out the lamp when the day's work is done.");return}
      if(S.phase==="over"){reading=false;S.desk=[];S.name=null;clearVisitor();place("register");return}
      if(busy()){say("Someone is still here.");return}
      if(G.blackoutUntil)return;
      if(S.day===S.blackoutDay&&!S.blackoutDone){
        if(!S.blackoutStage){S.blackoutStage=1;Sound.rattle();G.doorShake=performance.now();say("The door won't open. It's stuck fast.");return}
        S.blackoutDone=true;Sound.blackout();G.blackoutUntil=performance.now()+4800;say("");return;

}

  if(item.kind==="tip"||item.kind==="mystic"){const intro=[];introFor(n,intro);if(intro.length)ls.splice(1,0,...intro)}
  if(item.kind==="tip"){const at=attTier(n);
    if(at==="warm")ls.splice(1,0,{t:pk([...(V.pre||[]),...PLEASANT[weatherOf(S.day)],...WARM_HELLO])});
    else if(at==="curt"||at==="cold")ls.splice(1,0,{t:pk(["I'll not stay. Just thought you ought to know something.","Don't make a fuss. I'm only here a minute.","I'm not here to chat."])});
    else if(V.pre&&V.pre.length&&Math.random()<.6)ls.splice(1,0,{t:pk(V.pre)})}
  return {lines:ls,choices:sc.choices};
}
function arrive(item){
  if(G.visitor)return;
  const n=whoFor(item);
  if(reading){reading=false;renderReading()}picker=null;renderPicker();
  G.talkItem=item;
  if(!G.renderer){openTalk();return}
  const hm=n.age===14?.78:n.height==="short"?.93:n.height==="tall"?1.07:1,h=5.9*hm;
  const tex=[spriteTex(n,0,false),spriteTex(n,1,false),spriteTex(n,0,true)];
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex[0],transparent:true}));
  sp.material.color.setScalar(S.phase==="day"?[.95,.82,.8,.72,.64][WEATHERS.indexOf(weatherOf(S.day))]:.52);
  sp.scale.set(h/2,h,1);sp.position.set(7.05,-2.6+h/2,-6.2);G.scene.add(sp);
  G.visitor={sp,tex,h,state:"door",t:0,path:[[7.05,-4.3],[.6,-4.3]],leg:0,lastF:0};
  G.doorOpen=true;S.say="";renderHud();
  Sound.door();
  reframe();
}
function stepVisitor(dt,now){
  const V=G.visitor;if(!V)return;
  V.t+=dt;
  const sp=V.sp,walk=(tx,tz)=>{const dx=tx-sp.position.x,dz=tz-sp.position.z,dist=Math.hypot(dx,dz),st=3.0*dt*(G.fast||1);
    if(dist<=st){sp.position.x=tx;sp.position.z=tz;return true}sp.position.x+=dx/dist*st;sp.position.z+=dz/dist*st;
    V.leg+=dt;const f=Math.floor(V.leg/.2)%2;if(f!==V.lastF){V.lastF=f;Sound.step(Math.max(-.9,Math.min(.9,sp.position.x/8)))}
    sp.material.map=V.tex[f];sp.position.y=-2.6+V.h/2+Math.abs(Math.sin(V.leg*15.7))*.06;return false};
  if(V.state==="door"){if(V.t>.5){V.state="in";V.i=0}}
  else if(V.state==="in"){if(walk(...V.path[V.i])){V.i++;if(V.i>=V.path.length){V.state="talk";G.doorOpen=false;sp.material.map=V.tex[0];sp.position.y=-2.6+V.h/2;openTalk()}}}
  else if(V.state==="talk"){sp.material.map=(now%4200)<140?V.tex[2]:(G.speaking&&Math.floor(now/180)%2?V.tex[2]:V.tex[0]);sp.position.y=-2.6+V.h/2+Math.sin(now/700)*.015}
  else if(V.state==="out"){const back=[[7.05,-4.3],[7.05,-6.3]];if(V.i===undefined){V.i=0;G.doorOpen=true;Sound.door()}if(walk(...back[V.i])){V.i++;if(V.i>=back.length){G.scene.remove(sp);V.tex.forEach(t=>t.dispose());V.state="gone";G.doorOpen=false;G.visitor=null;reframe();refresh();setTimeout(processQueue,500)}}}
}
function portrait(n){const src=drawSprite(n,0,false),c=document.createElement("canvas");c.width=16;c.height=16;c.getContext("2d").drawImage(src,4,0,16,16,0,0,16,16);return c.toDataURL()}
/* ---- captions, one line at a time ---- */
let TALK=null;
function openTalk(){
  const item=G.talkItem;if(!item)return;
  const n=whoFor(item),sc=scriptFor(item);
  TALK={item,n,lines:sc.lines,choices:sc.choices||null,done:sc.done,i:-1,typing:false};
  $("talk").classList.add("show");
  $("talkFace").src=portrait(n);$("talkName").textContent=n.name;
  $("talkText").innerHTML="";
  nextLine();
}
function nextLine(){
  if(!TALK)return;
  if(TALK.typing){finishTyping();return}
  TALK.i++;
  if(TALK.i>=TALK.lines.length){
    if(TALK.choices){showChoices(TALK.choices);return}
    endVisit();return;
  }
  const L=TALK.lines[TALK.i];
  $("talkText").innerHTML=`<p class="${L.n?"narr":"cap"}"></p>`;
  const el=$("talkText").firstChild;
  TALK.full=L.n?L.t:`\u201C${L.t}\u201D`;TALK.pos=0;TALK.typing=true;
  if(!L.n){Sound.mumble(TALK.n,L.t.length);G.speaking=true}
  $("talkChoices").innerHTML=`<button class="more" id="talkMore">Continue</button> <button class="hurry" id="talkHurry">Hurry them along</button>`;
  $("talkMore").onclick=nextLine;$("talkHurry").onclick=hurry;
  if(TALK.choices)$("talkHurry").style.display="none";
  const speed=L.n?55:38;
  clearInterval(TALK.timer);
  const tid=TALK.timer=setInterval(()=>{if(!TALK||TALK.timer!==tid){clearInterval(tid);return}TALK.pos+=2;el.textContent=TALK.full.slice(0,TALK.pos);if(TALK.pos>=TALK.full.length)finishTyping()},1000/speed*2);
}
function finishTyping(){if(!TALK)return;clearInterval(TALK.timer);TALK.typing=false;G.speaking=false;const el=$("talkText").firstChild;if(el)el.textContent=TALK.full;if(TALK.i===TALK.lines.length-1&&TALK.choices)showChoices(TALK.choices)}
function hurry(){if(!TALK)return;clearInterval(TALK.timer);TALK.typing=false;G.speaking=false;if(TALK.choices){TALK.i=TALK.lines.length-1;finishTyping();showChoices(TALK.choices);return}endVisit()}
function showChoices(ch){
  $("talkChoices").innerHTML=ch.map((c,i)=>`<button data-ch="${i}">${esc(c.label)}</button>`).join("");
  $("talkChoices").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{TALK.choices=null;ch[+b.dataset.ch].fn()});
}
function talkMore(text,ch){
  if(!TALK)return;
  const quoted=/^".*"$/.test(text.trim());
  TALK.lines.push(quoted?{t:text.trim().replace(/^"|"$/g,"")}:{n:true,t:text});
  TALK.choices=ch;TALK.typing=false;nextLine();
}
$("talk").addEventListener("click",e=>{if(e.target.closest("button"))return;if(TALK&&!$("talkChoices").querySelector("[data-ch]"))nextLine()});
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&TALK&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT"&&!$("talkChoices").querySelector("[data-ch]")){e.preventDefault();nextLine()}});
function endVisit(msg){
  const item=G.talkItem;
  if(TALK){clearInterval(TALK.timer);if(TALK.done)TALK.done()}
  TALK=null;G.speaking=false;
  if(item&&(item.kind==="tip"||item.kind==="mystic"))item.done=true;
  if(S.queue&&S.queue[0]===item)S.queue.shift();
  $("talk").classList.remove("show");
  if(G.visitor){G.visitor.state="out";G.visitor.i=undefined}else setTimeout(processQueue,400);
  G.talkItem=null;
  if(msg)S.say=msg;else if(item&&(item.kind==="tip"||item.kind==="mystic"))S.say=`${whoFor(item).name} goes back out into ${{fair:"the street",rain:"the rain",fog:"the fog",heavy:"the rain",storm:"the storm"}[weatherOf(S.day)]}.`;
  saveGame();refresh();
}

$("sitBack").onclick=closeReading;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(picker){picker=null;S.say="";refresh()}else if(reading)closeReading()}});
init3D();
startGame("");
place("register");
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!G.renderer)return;G.tc={};G.newsHead=null;G.calKey=null;G.outKey=null;G.outCache={};
  const re=(t,a,b,k)=>{const n=pageTex(a,b,k);t.image=n.image;t.needsUpdate=true};
  re(G.letterTex.letter,"SHERIFF","Wapsie County");re(G.letterTex.report,"MEMORANDUM","Town Marshal's Office");re(G.letterTex.end,"OFFICE OF THE MAYOR","Hollow Creek, Iowa");
  sync3D()});

</script>
