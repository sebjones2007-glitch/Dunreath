<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunreath</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2C2017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dunreath">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Reenie+Beanie&family=Pinyon+Script&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#4B3627; --desk2:#3E2C20; --deskText:#E8DDC9; --deskFaint:#B9A78C;
  --paper:#F3EEE3; --paper2:#E9E0CC; --manila:#D5C29A; --manila2:#C8B287;
  --ink:#1E1A16; --ink2:#4A4136; --faint:#7B705F; --rule:rgba(30,26,22,.2);
  --news:"Old Standard TT",Georgia,"Times New Roman",serif;
  --mast:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
  --typeH:"Special Elite","Courier New",Courier,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#2C2017;--desk2:#231910;--deskText:#DCCFB8;--deskFaint:#A08F76}}
:root[data-theme="dark"]{--desk:#2C2017;--desk2:#231910;--deskText:#DCCFB8;--deskFaint:#A08F76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background-color:var(--desk);
  background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px,rgba(255,255,255,.02) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--desk),var(--desk2));
  color:var(--deskText);font-family:var(--type);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible+label{outline:2px solid var(--deskText);outline-offset:2px}
.paper button:focus-visible,.paper textarea:focus-visible{outline-color:var(--ink)}

.deskline{max-width:1280px;margin:0 auto;padding:14px 20px 6px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;color:var(--deskFaint);font-size:14px}
.deskline b{color:var(--deskText);font-weight:400}
.desk{max-width:1280px;margin:0 auto;padding:10px 20px 60px;display:grid;gap:20px;grid-template-columns:200px minmax(0,1fr)}
.desk.withfiles{grid-template-columns:200px minmax(0,1fr) minmax(0,380px)}
@media(max-width:1100px){.desk.withfiles{grid-template-columns:200px minmax(0,1fr)}.files-area{grid-column:2}}
@media(max-width:760px){.desk,.desk.withfiles{grid-template-columns:1fr}.files-area{grid-column:auto}}

/* desk items */
.items{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media(max-width:760px){.items{position:static;flex-direction:row;flex-wrap:wrap}}
.item{display:block;text-align:left;width:100%;background:var(--paper2);color:var(--ink);padding:10px 12px 9px;border-left:4px solid var(--manila2);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);transition:transform .12s}
@media(max-width:760px){.item{width:auto;flex:1 1 150px}}
.item:hover{transform:translateX(2px)}
.item[aria-current="true"]{background:var(--paper);border-left-color:var(--ink)}
.item .t{display:block;font-family:var(--typeH);font-size:15px}
.item .s{display:block;font-size:12px;color:var(--faint)}
.item.act{background:transparent;color:var(--deskText);border:1px solid var(--deskFaint);border-left-width:1px;box-shadow:none}
.item.act .s{color:var(--deskFaint)}
.item.act:hover{border-color:var(--deskText)}

/* paper */
.doc-area{min-width:0}
.paper{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.4);padding:30px 32px;position:relative}
@media(max-width:520px){.paper{padding:22px 18px}}
.paper+.paper{margin-top:18px}
.lh{text-align:center;font-family:var(--typeH);font-size:13px;letter-spacing:.06em;color:var(--ink2)}
.formtitle{text-align:center;font-family:var(--typeH);font-weight:400;font-size:22px;margin:6px 0 18px;letter-spacing:.08em}
.frow{display:flex;flex-wrap:wrap;gap:4px 18px;margin:3px 0}
.fld{display:flex;gap:8px;min-width:0;flex:1 1 260px}
.fld .l{color:var(--faint);white-space:nowrap}
.fld .v{border-bottom:1px dotted var(--rule);flex:1;min-width:0}
.sect{font-family:var(--typeH);font-size:14px;letter-spacing:.06em;margin:22px 0 6px;border-bottom:1px solid var(--ink);padding-bottom:2px}
.obs{margin:6px 0 0;padding-left:26px}
.obs li{margin:4px 0}
.qa p{margin:4px 0}
.nm{border-bottom:1px dotted var(--ink2);text-align:left}
.nm:hover{border-bottom-style:solid}
.persons{list-style:none;margin:6px 0;padding:0}
.persons li{margin:4px 0}
.persons .why{color:var(--faint)}
.disp{margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{flex:none;white-space:pre}
.sign{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{border:1px solid var(--ink);padding:7px 16px;font-family:var(--typeH);letter-spacing:.04em}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default;background:none;color:var(--ink)}
.stamp{position:absolute;top:26px;right:28px;border:3px double var(--ink);padding:4px 12px;font-family:var(--typeH);font-size:20px;letter-spacing:.2em;transform:rotate(-7deg);opacity:.75}
.muted{color:var(--faint)}
.signed{font-family:var(--hand);font-size:24px;margin-left:6px}

/* in-tray */
.folders{display:flex;flex-direction:column;gap:12px}
.folder{display:block;width:100%;text-align:left;background:var(--manila);color:var(--ink);padding:14px 18px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.3);position:relative}
.folder::before{content:"";position:absolute;top:-8px;left:14px;width:110px;height:9px;background:var(--manila)}
.folder .t{font-family:var(--typeH);font-size:16px}
.folder .s{display:block;font-size:13px;color:var(--ink2)}
.folder.done{background:var(--manila2);opacity:.8}
.folder.done::before{background:var(--manila2)}

/* newspaper */
.news{font-family:var(--news);padding:24px 28px 30px}
.mast{text-align:center;font-family:var(--mast);font-size:clamp(34px,6vw,56px);line-height:1;margin:6px 0 4px}
.ears{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-size:12px}
.ears .e{border:1px solid var(--ink);padding:4px 6px;line-height:1.3}
.ears .e:last-child{text-align:right}
.ears .motto{font-style:italic;text-align:center}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);margin:8px 0 14px;padding:3px 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.cols{columns:3 230px;column-gap:22px;column-rule:1px solid var(--rule)}
.story{break-inside:avoid-column;margin:0 0 16px}
.story.lead{column-span:all;border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.hd{font-family:var(--news);font-weight:700;text-transform:uppercase;text-align:center;line-height:1.05;margin:0;font-size:19px;letter-spacing:.01em}
.lead .hd{font-size:clamp(26px,4vw,38px)}
.deck{text-align:center;font-size:14px;margin:5px auto 0;padding-bottom:6px;border-bottom:1px solid var(--rule);max-width:36em;text-transform:uppercase;letter-spacing:.02em}
.deck+.deck{border-bottom:none}
.story p{margin:8px 0 0;text-align:justify;hyphens:auto;font-size:15px;line-height:1.45}
.story p .dl{font-variant:small-caps;letter-spacing:.03em}
.lead p{max-width:44em;margin-left:auto;margin-right:auto}
.col-h{font-weight:700;text-align:center;font-size:14px;letter-spacing:.08em;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:2px 0;margin:0 0 6px}
.personal p{margin:6px 0;font-size:14px;text-align:justify}
.ad{break-inside:avoid-column;border:2px solid var(--ink);padding:8px 10px;text-align:center;margin:0 0 16px;font-size:13px}
.ad b{display:block;font-size:17px;letter-spacing:.04em}

/* slips */
.slips{display:flex;flex-wrap:wrap;gap:22px;padding:8px 4px}
.slip{background:#FBF8F0;color:var(--ink);padding:18px 20px 16px;width:min(100%,330px);font-family:var(--hand);font-size:22px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.35)}
.slip:nth-child(odd){transform:rotate(-1.3deg)}
.slip:nth-child(even){transform:rotate(1.1deg)}
.slip .sig{text-align:right;margin-top:8px}
.deskmsg{color:var(--deskFaint);font-style:italic;padding:8px 2px}

/* files */
.files-area{display:flex;flex-direction:column;gap:18px;align-self:start}
.rfile{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.4);position:relative}
.rfile .tab{background:var(--manila);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-family:var(--typeH)}
.rfile .tab button{font-size:13px;border-bottom:1px dotted var(--ink)}
.rfile .body{padding:14px 16px 16px;font-size:14px}
.rfile .fld{flex-basis:100%}
.rfile .fld .l{min-width:92px}
.rfile .pair{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rfile .rec{margin:4px 0 0;padding-left:18px}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.card{text-align:left;background:#FBF8F0;border:1px solid var(--rule);padding:8px 10px;font-size:14px}
.card:hover{border-color:var(--ink)}
.card.open{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.card small{display:block;color:var(--faint);font-size:12px}

/* memo, letter, ledger */
.letter{font-size:15px;line-height:1.6}
.letter .head{text-align:center;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.letter .head b{display:block;font-family:var(--typeH);font-weight:400;font-size:18px;letter-spacing:.06em}
.letter p{margin:0 0 12px}
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger th{text-align:left;font-weight:400;color:var(--faint);border-bottom:1px solid var(--ink);padding:4px 6px}
.ledger td{border-bottom:1px dotted var(--rule);padding:6px;vertical-align:top}
.tablewrap{overflow-x:auto}
.calls{list-style:none;padding:0;margin:10px 0}
.calls li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
.calls .d{color:var(--faint);font-size:13px;flex:1 1 200px}
.convo p{margin:10px 0;line-height:1.6}
.convo .said{font-family:var(--news);font-style:italic;font-size:17px;padding-left:16px;border-left:2px solid var(--rule)}

/* notebook */
.nbnav{grid-column:1/-1;display:flex;justify-content:space-between;padding:8px 14px 0;position:relative;z-index:2}
.nbnav button{font-family:var(--type);font-size:13px;color:#5a4431}
.nbnav button:disabled{visibility:hidden}
.nb{display:grid;grid-template-columns:1fr 1fr;background:#FBF8F0;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.25),0 16px 36px rgba(0,0,0,.45);position:relative;min-height:560px}
.nb::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:18px;margin-left:-9px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.12),transparent)}
@media(max-width:760px){.nb{grid-template-columns:1fr}.nb::after{display:none}.nb .pg.left{border-bottom:1px solid var(--rule)}}
.pg{--lh:30px;padding:26px 24px 20px 46px;position:relative;font-family:var(--hand);font-size:23px;line-height:var(--lh);
  background-image:linear-gradient(90deg,transparent 34px,rgba(90,60,40,.35) 34px 35px,transparent 35px),repeating-linear-gradient(180deg,transparent 0 calc(var(--lh) - 1px),rgba(30,26,22,.16) calc(var(--lh) - 1px) var(--lh));background-position:0 56px;background-repeat:no-repeat,repeat-y;background-size:100% 100%,100% calc(100% - 56px)}
.pg .ph{font-family:var(--hand);font-size:22px;height:30px;margin-bottom:26px;display:flex;justify-content:space-between;align-items:baseline}
.pg .ph button{font-family:var(--type);font-size:13px;color:var(--faint)}
.pg .ph button:disabled{visibility:hidden}
.pg .txt{white-space:pre-wrap;min-height:420px;word-wrap:break-word}
.pg textarea{width:100%;min-height:440px;border:none;background:transparent;font:inherit;line-height:var(--lh);color:var(--ink);resize:vertical;padding:0;margin:0;outline:none}
.pg .blank{color:var(--faint)}
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;font-size:13px;color:var(--deskFaint);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
.objbar{position:absolute;left:0;right:0;bottom:0;padding:8px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px;color:var(--deskText);background:linear-gradient(0deg,rgba(10,7,5,.92),rgba(10,7,5,.6) 70%,rgba(10,7,5,0));z-index:7}
.objbar .muted{color:var(--deskFaint)}
.objbar button{border-bottom:1px dotted var(--deskFaint);padding:2px 0}
.objbar button:hover{border-bottom-color:var(--deskText)}
.say{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:20px;font-family:"IM Fell English",Georgia,serif;line-height:1.35;color:var(--deskText);text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;max-width:90%;pointer-events:none;z-index:2;font-style:italic}
.tip{position:fixed;display:none;pointer-events:none;background:var(--paper);color:var(--ink);font-size:12px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3}
.reading{position:absolute;inset:0;z-index:5;display:none;overflow-y:auto;background:rgba(14,10,7,.72);padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(90px + env(safe-area-inset-bottom,0px))}
.reading.show{display:block}
.rbar{max-width:1500px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;color:var(--deskText);font-size:14px;position:sticky;top:0;z-index:1;padding:6px 0;background:linear-gradient(180deg,rgba(14,10,7,.9),rgba(14,10,7,0))}
.rbar button{border:1px solid var(--deskFaint);padding:5px 14px;font-family:var(--typeH)}
.rbar button:hover{border-color:var(--deskText)}
.rbar #rmsg{color:var(--deskFaint);font-style:italic}
.rdocs{max-width:1500px;margin:0 auto;display:grid;gap:18px;align-items:start}
.rdocs.n1{grid-template-columns:minmax(0,900px);justify-content:center}
.rdocs.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rdocs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.rdocs.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.rdocs.n2,.rdocs.n3{grid-template-columns:minmax(0,1fr)}}
.slot{min-width:0}
.slotbar{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--deskFaint);font-size:13px;padding:0 2px 6px}
.slotbar button{border-bottom:1px dotted var(--deskFaint);color:var(--deskText)}
.slot .paper,.slot .rfile{margin:0}
.slot .nb{grid-template-columns:1fr}
.slot .nb::after{display:none}
.rdocs.n1 .nb{grid-template-columns:1fr 1fr}
.rdocs.n1 .nb::after{display:block}
@media(max-width:760px){.rdocs.n1 .nb{grid-template-columns:1fr}.rdocs.n1 .nb::after{display:none}}
.slot .nb .pg.left{border-bottom:1px solid var(--rule)}
.rdocs.n1 .nb .pg.left{border-bottom:none}
.picker{position:absolute;inset:0;z-index:6;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(14,10,7,.6);padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
.picker.show{display:flex}
.pickbox{background:var(--paper2);color:var(--ink);width:min(760px,100%);padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pickbox .paper{box-shadow:none;padding:0;background:transparent}
.pickbox .deskmsg{color:var(--faint)}
#app.flat{background:linear-gradient(180deg,var(--desk),var(--desk2))}
#app.flat #c3d{display:none}
#app.flat .say{bottom:auto;top:60px}
@media(max-width:760px){.say{top:calc(96px + env(safe-area-inset-top,0px));bottom:auto}}
#app.flat .objbar{top:48px;bottom:auto;background:none;font-size:15px}

.namein{font:inherit;color:var(--ink);background:#FBF8F0;border:none;border-bottom:1px solid var(--ink);padding:5px 6px;min-width:220px}
.namein:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select.other{font:inherit;color:var(--ink);background:#FBF8F0;border:1px solid var(--rule);padding:2px 4px;max-width:100%}
.ledger tr.cur td{background:rgba(30,26,22,.06)}
.ledger td:first-child{white-space:nowrap}
.objbar .snd{margin-left:auto;color:var(--deskFaint)}
.talk{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));width:min(780px,94vw);max-height:56vh;overflow-y:auto;background:var(--paper);color:var(--ink);display:none;gap:16px;padding:16px 18px 14px;box-shadow:0 2px 0 rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.5);z-index:8}
.talk.show{display:flex}
#talkFace{width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none;background:var(--paper2);border:1px solid var(--rule)}
.talk .tb{min-width:0;flex:1}
.talk .tn{font-family:var(--typeH);font-size:15px;letter-spacing:.04em;border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:4px}
#talkText p{margin:6px 0;line-height:1.5}
#talkText p:first-child{color:var(--faint);font-style:italic}
.talk .tc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.talk .tc button{border:1px solid var(--ink);padding:6px 12px;text-align:left;font-family:var(--type)}
.talk .tc button:hover,.talk .tc button:focus-visible{background:var(--ink);color:var(--paper)}
@media(max-width:520px){#talkFace{width:48px;height:48px}.talk{gap:10px;padding:12px}}

.fade{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:#050403;color:#e6dcc6}
.fade.day.on{opacity:1;pointer-events:auto;transition:opacity .8s ease}
.fade.day.off{opacity:0;transition:opacity .8s ease}
.fade.eyes{background:transparent;opacity:1}
.fade.eyes::before,.fade.eyes::after{content:"";position:absolute;left:0;right:0;height:51%;background:#050403;transition:transform .6s cubic-bezier(.6,0,.4,1)}
.fade.eyes::before{top:0;transform:translateY(-101%)}
.fade.eyes::after{bottom:0;transform:translateY(101%)}
.fade.eyes.on{pointer-events:auto}
.fade.eyes.on::before,.fade.eyes.on::after{transform:translateY(0)}
.fade .ft,.fade .fs{position:relative;z-index:1;opacity:0;transition:opacity .45s ease .55s;text-align:center}
.fade.on .ft,.fade.on .fs{opacity:1}
.fade.off .ft,.fade.off .fs{opacity:0;transition-delay:0s}
.fade .ft{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:clamp(40px,8vw,76px);letter-spacing:.06em}

    const keys=[...shuffle(attrs.filter(k=>!hiddenK.includes(k))).slice(0,n-(hiddenK.length&&Math.random()<.5?1:0))];
    if(keys.length<n&&hiddenK.length)keys.push(rnd(hiddenK));
    if(keys.length<2)continue;
    const innPool=others.filter(x=>x!==victim);
    const inns=innPool.map(x=>({x,s:keys.filter(k=>fits(x,k)).length+(x.rivals.includes(victim.id)?1:0)+Math.random()*1.4}))
      .sort((a,b)=>b.s-a.s).slice(0,2).map(o=>o.x);
    if(inns.length<2)continue;
    if(inns.some(x=>keys.every(k=>fits(x,k)))&&(day<=6||Math.random()<.7))continue;
    let misleading=null;
    if(day>=8&&Math.random()<.2){
      const target=rnd(inns),opts=attrsOf(target,false).filter(k=>!fits(culprit,k)&&!keys.includes(k));
      if(opts.length){misleading=rnd(opts);keys[Math.floor(Math.random()*keys.length)]=misleading}
    }
    let named=[culprit,...inns],outsider=false;
    if(!opt.crime&&day>=6&&Math.random()<Math.min(.14,.04+.005*day)){
      const spare=innPool.filter(x=>!inns.includes(x));
      if(spare.length){named=[wpick(spare,x=>1+keys.filter(k=>fits(x,k)).length),...inns];outsider=true}
    }
    const crPool=CRIMES[tier].filter(k=>!k.late||day>=15),crLate=crPool.filter(k=>k.late);
    let crimeP=opt.crime||(crLate.length&&Math.random()<Math.min(.8,(day-14)*.15)?pickCrime(crLate):pickCrime(crPool.filter(k=>!k.late)));
    if(!opt.crime&&culprit.id===8&&tier!=="petty"){const am=CRIMES.grave.filter(k=>k.n==="Attempted murder"&&(!k.late||day>=15));if(tier!=="grave"||!am.length)continue;crimeP=rnd(am)}

    const clueTexts=keys.map(k=>({text:clueFor(k,crimeP,srcOf(k)),eerie:false}));
    if(day>=10&&!quietSunday(day)&&Math.random()<.15)clueTexts.push({text:rnd(EERIE),eerie:true});
    if(day>=2&&Math.random()<.55)clueTexts.push({text:rnd(noiseFor(day)),eerie:false});
    if(tier!=="petty"&&day>=3&&Math.random()<.22){const cc=clothClue(culprit,crimeP);if(cc)clueTexts.push({text:cc,eerie:false})}
    const c={kind:"human",tier,culprit,victim,suspects:shuffle(named),keys,clues:shuffle(clueTexts),crime:crimeP,misleading,outsider};
    c.witness=genWitness(c);c.reasons=pickReasons(c);
    if(tier!=="petty"&&(tier!=="moderate"||Math.random()<.5)&&c.witness){const w2=genWitness(c,c.witness.n);if(w2&&!(w2.kind===c.witness.kind&&w2.about===c.witness.about&&w2.kind!=="hint"))c.witness2=w2}
    if(!opt.crime&&day>=5&&!outsider&&Math.random()<.09){c.murky=true;const shared=attrsOf(culprit,true).filter(k=>c.suspects.every(x=>fits(x,k)));
      c.clues=shuffle([...shuffle(noiseFor(day)).slice(0,2).map(t=>({text:t,eerie:false})),...(shared.length?[{text:clueFor(rnd(shared),c.crime,culprit,true),eerie:false}]:[])]);

}
function genSuper(day,tier){
  const pool=free();if(pool.length<4)return null;
  const victim=rnd(pool),others=pool.filter(n=>n!==victim);
  const suspects=[];
  while(suspects.length<3){
    const s=wpick(others.filter(o=>!suspects.includes(o)),o=>(o.pub.includes("occult")?1.8:1)+(o.rivals.includes(victim.id)?2:0)+o.shady*.5);
    suspects.push(s);
  }
  const crime=rnd(SUPER),clues=shuffle(EERIE).slice(0,day>=12?1:2).map(t=>({text:t,eerie:true}));
  // mundane clues come from different suspects, so they point in different directions
  const hs=shuffle(suspects).slice(0,day>=12?2:1),used=[];
  hs.forEach(h=>{const hk=attrsOf(h,day<=6).filter(k=>!used.includes(k)&&!hs.filter(o=>o!==h).some(o=>fits(o,k)));if(hk.length){const k=rnd(hk);used.push(k);clues.push({text:clueFor(k,crime,h),eerie:false})}});
  if(Math.random()<.5)clues.push({text:rnd(noiseFor(day)),eerie:false});
  const c={kind:"super",tier:tier==="petty"?"serious":tier,culprit:null,victim,suspects:shuffle(suspects),keys:[],clues:shuffle(dedupe(clues)),crime};
  c.witness=genWitness(c);c.reasons=pickReasons(c);
  return c;
}
function dedupe(cl){const s=new Set();return cl.filter(c=>!s.has(c.text)&&s.add(c.text))}
function genWitness(c,not){
  const pool=free().filter(x=>!c.suspects.includes(x)&&x!==c.victim&&x!==not);
  if(!pool.length)return null;
  const fam=pool.filter(w=>c.suspects.some(s=>relOf(w,s)==="family"));
  const riv=pool.filter(w=>c.suspects.some(s=>relOf(w,s)==="rival"));
  const r=Math.random();
  if(fam.length&&r<.3){const w=rnd(fam);return {n:w,kind:"vouch",about:c.suspects.find(s=>relOf(w,s)==="family")}}
  if(riv.length&&r<.5){const w=rnd(riv);return {n:w,kind:"accuse",about:c.suspects.find(s=>relOf(w,s)==="rival")}}
  const w=rnd(pool);
  if(c.kind==="super")return {n:w,kind:"eerie",text:rnd(["I saw a pale light by the door, drifting like a lantern with nobody carrying it.","I heard singing, very faint, in no language I know.","The air went cold as a cellar, and then I heard something laugh.","I saw a figure, but when I raised my lamp there was no one."])};
  const spare=attrsOf(c.culprit,false).filter(k=>!c.keys.includes(k));
  const trueKey=spare.length?rnd(spare):rnd(attrsOf(c.culprit,false));
  const innocents=c.suspects.filter(s=>s!==c.culprit);if(!innocents.length)innocents.push(rnd(c.suspects));
  const wrongOpts=innocents.flatMap(s=>attrsOf(s,false)).filter(k=>!fits(c.culprit,k));
  return {n:w,kind:"hint",trueKey,falseKey:wrongOpts.length?rnd(wrongOpts):trueKey,alibi:rnd(innocents),said:null};
}

function hear(src,text,about,apply=null){
  const h={hid:++S.heardSeq,src:src?src.id:null,text,about:about.map(a=>a.id),apply,noted:false};
  S.heard[h.hid]=h;return h;
}
function noteDown(hid){
  const h=S.heard[hid];if(!h||h.noted)return;
  h.noted=true;if(h.apply)h.apply();
  addNote(h.src!=null?N[h.src]:null,h.text,h.about.map(i=>N[i]));
}
function addNote(src,text,about,extra={}){
  const note={id:++S.noteSeq,day:S.day,src:src?src.id:null,text,about:about.map(a=>a.id),pinned:false,...extra};
  S.notes.push(note);return note;
}
function gossip(src,cases,{allowOwn=false}={}){
  // returns a note, or null
  const out=[];
  const humans=cases.filter(c=>c.kind==="human");
  const opts=[];
  if(humans.length)opts.push("hint","hint");
  opts.push("secret","tag");
  for(const kind of shuffle(opts)){
    if(kind==="hint"){
      const c=rnd(humans);let target=c.culprit;
      if(target===src||relOf(src,target)==="family"){ // protect self or family: blame a rival instead
        const rv=free().filter(x=>src.rivals.includes(x.id)&&x!==c.victim);
        if(!rv.length)continue;target=rnd(rv);
      }else if(relOf(src,target)==="friend")continue;
      else if(src.rel<75&&Math.random()<.2){const rv=free().filter(x=>src.rivals.includes(x.id)&&x!==c.victim);if(rv.length)target=rnd(rv)}
      return hear(src,hintQuote(target,c),[target,c.victim]);
    }
    if(kind==="secret"){
      let pool=free().filter(x=>x!==src&&relOf(src,x)!=="family");
      const rv=pool.filter(x=>src.rivals.includes(x.id));
      if(rv.length&&Math.random()<.7)pool=rv;
      if(!pool.length)continue;
      const t=rnd(pool);
      return hear(src,`Between us, ${t.name} ${t.secret}.`,[t]);
    }
    if(kind==="tag"){
      const pool=free().filter(x=>x!==src&&x.hid.length);
      if(!pool.length)continue;
      const t=rnd(pool),h=rnd(t.hid);
      return hear(src,`Did you know ${t.name} ${TAGQ[h]}?`,[t]);
    }
  }
  return null;
}

/* ---- letters to the editor ----
   Written by townsfolk who like or loathe you. Signed with initials and a street, so you can guess who wrote them. */
const PEN=["A Taxpayer","Mother of Four","One Who Remembers '81","A Plain Farmer","Name Withheld","A Churchgoer","An Old Settler"];
function streetOf(n){const a=n.addr||"";const m=a.match(/(Main Street|Oak Street|Elm Street|Front Street|River Road|Hill Road|Hill Cemetery|the fairgrounds|the river landing|south of the tracks|the river bottoms|St\. Brendan's)/);return m?m[1].replace(/^the /,""):"Dunreath"}
function pickFresh(opts){const used=(S.letters||[]).map(l=>l.body);const f=opts.filter(o=>!used.includes(o));return rnd(f.length?f:opts)}
function letterFor(d){
  const prev=S.history[S.history.length-2]||S.history[S.history.length-1],outs=prev?prev.cases.map(r=>r.outcome):[];

  let body;
  if(pro){
    const opts=[];
    if(outs.includes("solved"))opts.push("For the first time since the autumn I have slept with my back door unbolted. I credit the new detective, who has shown more sense in a fortnight than the council has shown in a year.");
    if(outs.includes("unexplained"))opts.push("Those who laugh at the detective's findings of \"no human hand\" have not walked the river bottoms after dark lately. I have. I would rather have an officer who admits what cannot be explained than one who hangs it on the nearest poor soul.");
    if(V&&V.outcome==="stoodDown")opts.push("The detective stood alone in the station doorway and turned away a crowd with pick handles. That took more courage than I have seen from any man on the council.");
    if(H&&H.news==="foiled")opts.push("The gang that meant to rob this town went away with nothing. I hope those who wrote to this paper complaining will have the grace to write again.");
    opts.push("I write only to say that the detective has been civil to me, and fair, and has listened when others would not. In these times that is not nothing.","Much has been written in these columns against our new officer. Let me say plainly that I have found the detective honest, and patient, and willing to hear a poor man out. The council should count itself lucky.","I have lived in Dunreath forty years and seen three marshals come and go. None of them worked as hard as this one. Give the detective time.");
    body=pickFresh(opts);

    if(outs.includes("unexplained"))opts.push("Are we now to be told by an officer of the county that our troubles are caused by ghosts? My grandmother believed in ghosts. She did not draw a salary for it.");
    if(outs.includes("shelved"))opts.push("Complaint after complaint left open. My own was among them. I am told the matter is \"under consideration.\" So, I suppose, is the weather.");
    if(V&&V.outcome==="appeased")opts.push("A woman was handed over to a crowd at the station door and held without charge. Whatever one thinks of her, that is not the law as I was taught it.");
    if(V&&V.outcome==="frenzy")opts.push("A woman is dead who might have been kept safe in a cell for a night. The detective refused, and the town has paid for that pride.");

function letterDoc(){
  return `<article class="paper letter">
    <div class="head"><b>OFFICE OF THE SHERIFF</b>Wapsie County, Iowa</div>
    <p style="text-align:right">${fullDate(1)}</p>
    <p>Dear Detective ${esc(S.name||"")},</p>
    <p>You are hereby assigned to the town of Dunreath for a trial period of twenty days, at the request of Mayor Crane and the council. You will work from the front desk of the old town marshal's station. You will find complaints in your in-tray each morning, and a file on every resident in the card index.</p>
    <p>A word of advice. The evidence at a scene will rarely name anyone. You must reason from it to the person, and you will not always be sure. People with complaints will come to you each morning, and others drop in now and then, early or late, and some will tell you a great deal once they trust you, and nothing at all if they don't. They are not above lying for their own kin, or against those they dislike. Whatever you hear, you had better write in your notebook at the end of the day, for no one will say it twice.</p>
    <p>The trouble so far has been small, but I expect it to grow. You will also hear talk of strange things. Most is nonsense. Not all of it. Where you find no human hand in a matter, say so plainly and close it. If it comes to that, someone in town who claims to understand such things may come to you. I leave it to your judgment whether to listen.</p>
    <p>One thing more. The county has had word of a gang working the river towns. They take small things first. Watch for a pattern.</p>
    <p>The council will judge you on results. Charge the wrong person, or let the town's temper get away from you, and I will not be able to keep you there. Bear in mind, too, that the sentence you ask for matters. Too soft on a real villain and the town will say so; too hard on an innocent and they will never forgive you. And do not assume the guilty party is always among those first named.</p>
    <p>Yours faithfully,<br><span class="signed">H. R. Lindqvist</span><br>Sheriff</p>
  </article>`;
}

function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}
function scrawl(text,seed){

    const rot=(r(1)-.5)*2.2,dx=r(2)*12,fs=23+Math.round(r(3)*6),ls=((r(4)-.5)*1.4).toFixed(2),op=(.78+r(5)*.22).toFixed(2),sk=((r(6)-.5)*6).toFixed(1);
    return `<span class="ln" style="transform:translateX(${dx.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) skewX(${sk}deg);font-size:${fs}px;letter-spacing:${ls}px;opacity:${op}">${ln||"&nbsp;"}</span>`}).join("");
}
function stain(seed){if(seeded(seed*7.3)>.34)return "";const x=10+seeded(seed*3.1)*70,y=8+seeded(seed*5.7)*70,sz=90+seeded(seed*2.2)*70;return `<span class="stain" style="left:${x.toFixed(0)}%;top:${y.toFixed(0)}%;width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px"></span>`}

    {label:"Promise him it goes no further",fn:()=>{done();adj(n,5);endVisit(`Father Dunn nods once and goes, crossing himself at the door.`)}}]};

function tipsFor(src,cases,morningVisit){
  const out=[],H=S.heist;
  const safe=x=>x&&x!==src&&relOf(src,x)!=="family";
  cases.forEach(c=>{
    if(c.kind!=="human")return;
    const cu=c.culprit,v=c.victim;
    if(!safe(cu))return;
    if(cu.rivals.includes(v.id))out.push({w:5,t:morningVisit?`About ${v.name}'s trouble. I'd not say this to just anyone, but ${cu.name} can't abide ${v.called==="Mrs. Ashby"?"her":v.called}. Never could.`:`I'd keep an eye on ${cu.name}. ${He(cu)} can't abide ${v.name}, and I heard ${him(cu)} say as much only yesterday.`});
    else out.push({w:3,t:morningVisit?`I'll tell you who was out and about the night ${v.name} had that trouble: ${cu.name}. Make of it what you will.`:`${cu.name} was at the lunchroom asking about ${v.name}. What time the ${v.place} gets locked up, that sort of thing.`});
    cu.hid.forEach(h=>out.push({w:c.keys.includes("tag:"+h)?5:2,t:`You didn't hear it from me, but ${cu.name} ${TAGQ[h]}.`}));
    if(c.outsider&&morningVisit)out.push({w:6,t:`They're looking at the wrong folks over ${v.name}'s trouble. I'd want to know where ${cu.name} was.`});
    if(morningVisit)c.suspects.filter(s=>s!==cu&&safe(s)&&s!==src).forEach(s=>out.push({w:2.5,t:`Whatever they're saying about ${s.name}, ${he(s)} was nowhere near it. ${He(s)} was at my place most of that night.`}));
  });
  if(H&&!H.resolved&&S.day>=6){const m=[H.boss,H.mate].filter(x=>safe(x)&&!x.jailed);if(m.length){const x=rnd(m);out.push({w:4,t:`Somebody's been asking a lot of questions about ${H.target.name}. The hours, the locks, who sleeps nearby. It was ${x.name}.`})}}
  const AR=S.art;if(AR&&!AR.resolved&&S.day>=10){const m=[AR.thief,AR.fence].filter(x=>safe(x)&&!x.jailed);if(m.length){const x=rnd(m);out.push({w:4,t:rnd([`${x.name} was asking Jonah whether the ferry takes crates at night. Flat ones.`,`I saw ${x.name} with paint on ${his(x)} cuffs. Oil paint. Now what would ${he(x)} want with that?`,`${x.name} has been writing letters to Chicago. The postmistress told me.`])})}}
  RIVALS.forEach(([a,b])=>{const A=N[a],B=N[b];if(safe(A)&&safe(B))out.push({w:1,t:`Here's something you won't find in any file: ${A.name} really dislikes ${B.name}. Has for years.`})});
  out.forEach(o=>o.w+=Math.random()*1.5);
  const foes=free().filter(x=>src.rivals.includes(x.id)&&x!==src);
  if(foes.length&&Math.random()<.35){const f=rnd(foes),F=f.name;
    const gripe=rnd([`Between you and me, ${F} is a snake. Always has been.`,`I'll say it if nobody else will. ${F} thinks the sun rises for ${him(f)} alone.`,`You know what ${F} did at the church supper? Took the last of the chicken and never said thank you. That's the sort ${he(f)} is.`,`I wouldn't trust ${F} to mind a dog. I've said so to ${his(f)} face.`,`${F} owes half the town money and walks about like ${he(f)} owns the other half.`,`Mark me, ${F} will come to a bad end. I only hope I'm there to see it.`]);
    return [gripe,out.length?out[0].t:`Anyway. That's all. I just had to say it to someone.`]}
  out.sort((a,b)=>b.w-a.w);
  const picked=[];out.forEach(o=>{if(picked.length<2&&!picked.includes(o.t))picked.push(o.t)});
  // now and then, a visitor with a grudge points the wrong way
  if(picked.length&&Math.random()<.12){const rv=free().filter(x=>src.rivals.includes(x.id));if(rv.length){const liar=rnd(rv);picked[0]=`If you want my opinion, whatever's going wrong in this town, ${liar.name} is at the bottom of it.`}}
  return picked;
}
function greet(v){

  const w=weatherOf(S.day);
  const wet=w==="fair"?"":w==="fog"?" out of the fog":w==="rain"?" and shakes the rain from "+(n.sex==="f"?"her":"his")+" hat":` and stamps the ${w==="storm"?"worst of the storm":"rain"} off ${n.sex==="f"?"her":"his"} boots`;
  return m?`${n.name} comes in early, before the first complaint is typed${wet}.`:`${n.name} comes in as you are about to put the lamp out${wet}.`;
}
function visitScript(v){
  const n=v.npc,r=S.rite;
  if(v.kind==="tip"&&v.step==="confess"&&v.case)return confessScript(v);
  if(v.step==="sunday")return sundayScript(v);
  if(v.step==="pip")return pipScript(v);
  if(v.step==="pipfound")return pipFoundScript(v);
  if(v.step==="sunday19")return sunday19Script(v);
  if(v.kind==="tip"){
    v.tips=v.tips||tipsFor(n,v.when==="morning"?S.cases:S.next,v.when==="morning");
    const first=v.tips[0]||"Nothing much to tell. Only that folks are watching how you do.";
    return {lines:[greet(v),`"${first}"`],choices:[
      {label:"Pour a cup of coffee and ask what else they know",fn:()=>{adj(n,10);const more=v.tips[1];talkMore(more?`"${more}"`:`"That's all I know, honestly. Thanks for the coffee."`,[{label:"Thank them and see them out",fn:()=>endVisit()}])}},
      {label:"Thank them",fn:()=>{adj(n,5);endVisit()}},
      {label:"Show them out",fn:()=>{adj(n,-6);endVisit(`${n.name} leaves without another word.`)}}]};
  }
  const st=r.story,pr=!N[8].jailed?N[8]:null,lady=partnerNpc(),ladyOk=lady&&lady.id!==8;
  const bump=()=>{if(r.ladyMet&&(r.priestMet||!pr))r.stage=Math.max(r.stage,1),r.correct=0};
  if(v.step==="lady0")return {lines:[greet(v),`"I'll not waste your time. You've heard the talk. What's walking in this town is ${st.who}."`,`"It was quiet for years. Something woke it. The flood talk, maybe, or the new mill digging up the old ground."`,`"I can't lay it to rest alone, and you can't at all. But if you learn to know its work when it crosses your desk, and close those cases honestly without blaming a living soul, we might manage it together."`],
    choices:[{label:"Say you'll watch for it",fn:()=>{r.ladyMet=true;adj(n,5);bump();endVisit()}},{label:"Say it's nonsense",fn:()=>{r.ladyMet=true;adj(n,-5);bump();endVisit(`${n.name} shrugs. "You'll see," ${he(n)} says, and goes.`)}}]};
  if(v.step==="priest0"){
    const known=r.ladyMet&&ladyOk;
    return {lines:[{n:true,t:`Father Dunn comes in early and shuts the door carefully behind him.`}.t,`"I'll speak plainly, detective, and I'd thank you not to repeat it."`,known?`"I know ${lady.name} has been to see you. I don't hold with herbs and cards. But she's right that something is out there."`:`"There is a soul in this town that can't rest. I think you've begun to see it."`,known?`"The Church prays for the dead, detective. Every soul, however it died. When the time comes I'll say the prayers over it, and a Mass for its repose. That's the Church's way, and the only one I hold with. I can't promise it will be enough."`:`"It's ${st.who}. I've found the name in the parish register. Nobody ever prayed for that soul properly. When the time comes, I will."`,`"Close its cases honestly. When you've seen enough, we'll talk again."`],
      choices:[{label:"Thank him",fn:()=>{r.priestMet=true;if(!known)r.ladyMet=true;adj(n,6);bump();endVisit()}},{label:"Ask whether the Church really believes in ghosts",fn:()=>{adj(n,2);talkMore(`He smiles a little. "The Church believes in souls, detective, and in the mercy of God. A soul nobody has prayed for is a lonely thing. I'd rather pray for one that isn't there than leave one that is."`,[{label:"See him out",fn:()=>{r.priestMet=true;if(!known)r.ladyMet=true;bump();endVisit()}}])}}]};
  }
  if(v.step==="quiz"){
    const recent=S.history.slice(-8).flatMap(h=>h.cases).filter(c=>c.ref&&c.outcome&&c.outcome!=="pending");
    const sup=recent.filter(c=>c.ref.kind==="super"&&c.outcome==="unexplained"),hum=shuffle(recent.filter(c=>c.ref.kind==="human"));
    if(!sup.length){return {lines:[greet(v),`"You've been closing its cases, I hear. Good. I'll come back when there's more to talk about."`],choices:[{label:"See them out",fn:()=>endVisit()}]}}
    const right=rnd(sup),opts=shuffle([right,...hum.slice(0,2)]);
    return {lines:[greet(v),n.id===8?`"Before we go further, I must know you can tell its work from a man's. Which of these was it?"`:`"You've closed some of its doings. Let's see if you know them. Which of these was its work, and not a living hand?"`],
      choices:opts.map(o=>({label:`${cap(o.title)} (No. ${o.no})`,fn:()=>{
        if(o===right){r.stage=2;r.correct=0;adj(n,6);talkMore(`${He(n)} nods slowly. "That's it." Then, lower: "It wants ${st.want}. It waits at ${st.place}. Close one more of its doings rightly, and it will be ready to listen. We'll come for you that night."`,[{label:"Say you'll be ready",fn:()=>endVisit()}])}
        else{r.correct=Math.max(0,r.correct-1);adj(n,-5);talkMore(`"No. That was a living hand, plain as day." ${He(n)} looks at you a long moment. "You're not ready. Close its cases honestly, and I'll come again."`,[{label:"See them out",fn:()=>endVisit()}])}
      }}))};
  }
  // the rites: two ways of doing it, and each is a coin toss

      else{r.stage=4;r.justDone=true;S.unrest=clamp(S.unrest-25);S.rep=clamp(S.rep+8);adj(m,14);talkMore(`${scene} At midnight the rain stops, all at once, for the space of a breath. Something passes you, cold and light, going away. When the rain starts again it sounds like ordinary rain. ${m.name} says nothing for a long time, and then only, "There. ${st.pro||"She"}'s gone home."`,[{label:"Walk back to the station",fn:()=>endVisit()}])}

  ch.push({label:"Not tonight",fn:()=>endVisit(`"Tomorrow, then," ${he(n)} says. "It won't wait forever."`)});

    $("hud-r").innerHTML=`Detective ${esc(S.name)}. Day ${S.day} of ${DAYS}. Council's opinion: ${council(councilScore())}. Temper of the town: ${temper(S.unrest)}.`;

function busy(){return (S.queue&&S.queue.length)||(G.visitor&&G.visitor.state!=="gone")}
function act(k){
  S.say="";
  if(!S.name&&k!=="register"&&k!=="pipe"){place("register");return}
  if(G.visitor&&G.visitor.state!=="gone"&&!["pipe","notebook","coffee"].includes(k)){say("Someone is speaking to you.");return}
  switch(k){
    case "tray":case "cards":picker=k;Sound.rustle();refresh();return;
    case "pipe":smoke();return;
    case "coffee":drink();return;
    case "lamp":
      if(S.phase!=="day")return;
      if(busy()){say("There's still someone to see before you finish.");return}
      if(S.cases.some(c=>!c.filed)){say("There are still complaints in the in-tray.");return}
      endWorkday();return;
    case "hat":
      if(S.phase==="day"){say("Not yet. Put out the lamp when the day's work is done.");return}
      if(S.phase==="over"){reading=false;S.desk=[];S.name=null;clearVisitor();place("register");return}
      if(busy()){say("Someone is still here.");return}

}

function newsFace(x,w,h,headline){

  x.fillStyle="#1E1A16";x.textAlign="center";
  x.font=`${Math.round(w*.082)}px "UnifrakturMaguntia", serif`;x.fillText("The Dunreath Courier",w/2,h*.12);
  x.fillRect(20,h*.15,w-40,3);x.fillRect(20,h*.175,w-40,1);
  x.font=`bold ${Math.round(w*.058)}px "Old Standard TT", serif`;
  const words=(headline||"").split(" ");let line="",y=h*.25;const lines=[];
  words.forEach(wd=>{const t=line?line+" "+wd:wd;if(x.measureText(t).width>w-60){lines.push(line);line=wd}else line=t});if(line)lines.push(line);
  lines.slice(0,2).forEach((l,i)=>x.fillText(l,w/2,y+i*w*.065));

}

    cp.material.map=moving?C.tex[Math.floor(C.leg/.2)%2]:((now+i*900+2100)%5200<140?C.tex[2]:C.tex[0]);cp.position.y=-2.6+C.h/2+(moving?Math.abs(Math.sin(C.leg*15.7))*.06:0)});
}
function portrait(n){const src=drawSprite(n,0,false),c=document.createElement("canvas");c.width=16;c.height=16;c.getContext("2d").drawImage(src,4,0,16,16,0,0,16,16);return c.toDataURL()}
/* ---- captions, one line at a time ---- */
let TALK=null;
function openTalk(){
  const item=G.talkItem;if(!item)return;
  const n=whoFor(item),sc=scriptFor(item);
  TALK={item,n,lines:sc.lines,choices:sc.choices||null,done:sc.done,i:-1,typing:false};
  $("talk").classList.add("show");
  $("talkFace").src=portrait(n);$("talkName").textContent=n.name;
  $("talkText").innerHTML="";
  nextLine();
}
function nextLine(){
  if(!TALK)return;
  if(TALK.typing){finishTyping();return}
  TALK.i++;
  if(TALK.i>=TALK.lines.length){
    if(TALK.choices){showChoices(TALK.choices);return}
    endVisit();return;
  }
  const L=TALK.lines[TALK.i];
  $("talkText").innerHTML=`<p class="${L.n?"narr":"cap"}"></p>`;
  const el=$("talkText").firstChild;
  TALK.full=L.n?L.t:`\u201C${L.t}\u201D`;TALK.pos=0;TALK.typing=true;
  if(!L.n){Sound.mumble(TALK.n,L.t.length);G.speaking=true}
  $("talkChoices").innerHTML=`<button class="more" id="talkMore">Continue</button> <button class="hurry" id="talkHurry">Hurry them along</button>`;
  $("talkMore").onclick=nextLine;$("talkHurry").onclick=hurry;
  if(TALK.choices)$("talkHurry").style.display="none";
  const speed=L.n?55:38;
  clearInterval(TALK.timer);
  const tid=TALK.timer=setInterval(()=>{if(!TALK||TALK.timer!==tid){clearInterval(tid);return}TALK.pos+=2;el.textContent=TALK.full.slice(0,TALK.pos);if(TALK.pos>=TALK.full.length)finishTyping()},1000/speed*2);
}
function finishTyping(){if(!TALK)return;clearInterval(TALK.timer);TALK.typing=false;G.speaking=false;const el=$("talkText").firstChild;if(el)el.textContent=TALK.full;if(TALK.i===TALK.lines.length-1&&TALK.choices)showChoices(TALK.choices)}
function hurry(){if(!TALK)return;clearInterval(TALK.timer);TALK.typing=false;G.speaking=false;if(TALK.choices){TALK.i=TALK.lines.length-1;finishTyping();showChoices(TALK.choices);return}endVisit()}
function showChoices(ch){
  $("talkChoices").innerHTML=ch.map((c,i)=>`<button data-ch="${i}">${esc(c.label)}</button>`).join("");
  $("talkChoices").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{TALK.choices=null;ch[+b.dataset.ch].fn()});
}
function talkMore(text,ch){
  if(!TALK)return;
  const quoted=/^".*"$/.test(text.trim());
  TALK.lines.push(quoted?{t:text.trim().replace(/^"|"$/g,"")}:{n:true,t:text});
  TALK.choices=ch;TALK.typing=false;nextLine();
}
$("talk").addEventListener("click",e=>{if(e.target.closest("button"))return;if(TALK&&!$("talkChoices").querySelector("[data-ch]"))nextLine()});
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&TALK&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT"&&!$("talkChoices").querySelector("[data-ch]")){e.preventDefault();nextLine()}});
function endVisit(msg){
  const item=G.talkItem;
  if(TALK){clearInterval(TALK.timer);if(TALK.done)TALK.done()}
  TALK=null;G.speaking=false;
  if(item&&(item.kind==="tip"||item.kind==="mystic"))item.done=true;
  if(S.queue&&S.queue[0]===item)S.queue.shift();
  $("talk").classList.remove("show");
  if(G.visitor){G.visitor.state="out";G.visitor.i=undefined}else setTimeout(processQueue,400);
  G.talkItem=null;
  if(msg)S.say=msg;else if(item&&(item.kind==="tip"||item.kind==="mystic"))S.say=`${whoFor(item).name} goes back out into ${{fair:"the street",rain:"the rain",fog:"the fog",heavy:"the rain",storm:"the storm"}[weatherOf(S.day)]}.`;
  saveGame();refresh();
}

$("sitBack").onclick=closeReading;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(picker){picker=null;S.say="";refresh()}else if(reading)closeReading()}});
/* ================= title screen ================= */
let titlePane="menu";
function showTitle(pane){titlePane=pane||"menu";$("title").classList.add("show");document.body.classList.add("titling");renderTitle()}
function hideTitle(){$("title").classList.remove("show");document.body.classList.remove("titling")}
function latestOpenSave(){return readSaves().filter(x=>!x.outcome).sort((a,b)=>(b.updated||0)-(a.updated||0))[0]}
const CREDITS=`<h3>DESIGNED AND DEVELOPED BY</h3><p>Seb</p>
<h3>PLAYTESTING</h3><p>Oli, much esteemed playtester</p>
<h3>TYPEFACES</h3><p>UnifrakturMaguntia, IM Fell English, Old Standard TT, Courier Prime, Special Elite, Caveat, Pinyon Script and Reenie Beanie, from Google Fonts under the SIL Open Font License</p>
<h3>THE DESK</h3><p>Built with three.js (MIT License)</p>
<h3>SOUND</h3><p>Every sound is made in the browser as you play</p>
<h3>SAVES</h3><p>Online register kept with Supabase</p>
<h3>MADE WITH THE HELP OF</h3><p>Claude, by Anthropic</p>`;
function curtain(fn,reveal){const c=$("curtain");c.style.transition="";c.classList.add("on");
  setTimeout(()=>{fn();if(reveal!==false)setTimeout(()=>{c.style.transition="opacity 1.3s ease";c.classList.remove("on")},250);
    else setTimeout(()=>{c.style.transition="none";c.classList.remove("on");void c.offsetWidth;c.style.transition=""},900)},950)}
let installEvt=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const installable=()=>!standalone()&&!/DunreathDesktop/.test(navigator.userAgent)&&location.protocol.startsWith("http");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
addEventListener("appinstalled",()=>{installEvt=null;if(titlePane==="menu")renderTitle()});
function renderTitle(){
  const b=$("tbody");if(!b)return;
  if(titlePane==="install"){
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    b.innerHTML=`<div class="tpane tname"><p>${ios?"In Safari, press the Share button, then choose Add to Home Screen.":"Open your browser's menu and choose Install Dunreath, or Add to Home Screen."}</p><p class="muted">Dunreath will then open from its own icon, like any other app. It always runs the latest edition of the game, so there is nothing to download again.</p><button class="btn tback" data-t="menu">Back</button></div>`;
  }
  else if(titlePane==="credits"){b.innerHTML=`<div class="tpane">${CREDITS}<button class="btn tback" data-t="menu">Back</button></div>`}
  else if(titlePane==="new"||titlePane==="easy"){
    const easy=titlePane==="easy";
    b.innerHTML=`<div class="tpane tname"><p>${easy?"Easy terms. The council gives its word not to recall you, however badly things go.":"Twenty days at the desk. The council may recall you if the town turns against you."}</p><label for="tName" class="muted">Your name, Detective</label><input id="tName" class="namein" maxlength="28" placeholder="e.g. Harriet Lowe" autocomplete="off"><button class="btn" id="tGo">Take the post</button><button class="btn tback" data-t="menu" style="margin-top:0">Back</button></div>`;
    const ni=$("tName"),go=()=>{const n=ni.value.trim().replace(/\s+/g," ");if(!n){ni.focus();return}Sound.rustle();curtain(()=>{hideTitle();startGame(n,easy&&easyUnlocked())},false)};
    $("tGo").onclick=go;ni.onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>ni.focus(),50);
  }else{
    const cont=latestOpenSave(),open=easyUnlocked();
    b.innerHTML=`<nav class="tmenu" aria-label="Title menu">
      ${cont?`<button data-t="continue">Continue<span class="tnote">${esc(cont.name)}, day ${cont.day}${cont.easy?", easy terms":""}</span></button>`:""}
      <button data-t="new">New Game</button>
      <button data-t="easy"${open?"":" disabled"}>Easy Mode<span class="tnote">${open?"The council will not recall you":"Offered once you have taken the post on ordinary terms"}</span></button>
      <button data-t="register">Register of Detectives</button>
      ${installable()?`<button data-t="install">Install as App<span class="tnote">Keeps Dunreath on your device, and it updates itself</span></button>`:""}
      <button data-t="credits">Credits</button></nav>`;
  }
  b.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>{
    const t=x.dataset.t;
    if(t==="continue"){const c=latestOpenSave();if(c)curtain(()=>{hideTitle();loadGame(c.id)});return}
    if(t==="register"){hideTitle();Sound.rustle();place("register");return}
    if(t==="easy"&&!easyUnlocked())return;
    if(t==="install"&&installEvt){const e=installEvt;installEvt=null;e.prompt();e.userChoice.finally(()=>{titlePane="menu";renderTitle()});return}
    titlePane=t;renderTitle();
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("title").classList.contains("show")&&titlePane!=="menu"){titlePane="menu";renderTitle()}});

cloudInit();
init3D();
startGame("");
if(/access_token|error_description/.test(location.hash))place("register");else showTitle();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!G.renderer)return;G.tc={};G.newsHead=null;G.calKey=null;G.outKey=null;G.outCache={};
  const re=(t,a,b,k)=>{const n=pageTex(a,b,k);t.image=n.image;t.needsUpdate=true};
  re(G.letterTex.letter,"SHERIFF","Wapsie County");re(G.letterTex.report,"MEMORANDUM","Town Marshal's Office");re(G.letterTex.end,"OFFICE OF THE MAYOR","Dunreath, Iowa");
  sync3D()});
